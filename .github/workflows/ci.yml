name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Domain & API tests
        run: npm test
      - name: V45 backup, restore and migration rehearsal
        run: npm run test:recovery
      - name: Syntax checks
        run: npm run check
      - name: Build Next.js App Router
        run: npm run build
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (synthetic local content, no paid API)
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-v41-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: ignore
