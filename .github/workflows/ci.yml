name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22.19.0, cache: npm }
      # 仓库不带 .npmrc（镜像约定属本机环境，见 README「依赖与网络」）：
      # CI 显式走 npm 官方源，锁件 resolved 也已指向 registry.npmjs.org。
      - name: npm ci（显式官方源）
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test
      - name: e2e (xvfb)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          # 沙箱预案：若 e2e 报 Chromium 沙箱错误（"No usable sandbox" / SUID sandbox
          # 不可用），取消下一行注释对 Electron 关闭沙箱——仅限 CI 容器，
          # 本地开发与发布产物绝不关闭沙箱：
          # export ELECTRON_DISABLE_SANDBOX=1
          xvfb-run -a npm run e2e
