name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V30-V48 lineage before or after integration
        run: npm run verify:integration
      - name: V54 consolidated merge ancestry and release-surface audit
        run: npm run integration:preflight
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Domain & API tests
        run: npm test
      - name: V45 backup, restore and migration rehearsal
        run: npm run test:recovery
      - name: V46 release integrity and negative-tamper regressions
        run: npm run test:release
      - name: V47 restored-database cross-channel integration acceptance
        run: npm run test:integration
      - name: V48 merged mainline safety regressions
        run: npm run test:mainline
      - name: V58 localhost API CSRF and Host/Origin ingress regressions
        run: npm run test:security:v58
      - name: Syntax checks
        run: npm run check
      - name: V54 consolidation admission negative regressions
        run: npm run test:integration:v54
      - name: V55 real-host release packet negative regressions (synthetic, no private data)
        run: npm run test:release:v55
      - name: V59 GitHub CI attestation and operator-packet fail-closed regressions (offline)
        run: npm run test:release:v59
      - name: V60 actual SQLite rollback and fault-injection acceptance on synthetic WAL data
        run: npm run test:rollback:v60
      - name: V61 chained operator technical acceptance (synthetic WAL, offline GitHub)
        run: npm run test:acceptance:v61
      - name: V62 protected WAL snapshot preparation and chained V61 acceptance (synthetic)
        run: npm run test:prepare:v62
      - name: V63 strict real-Git checkout provenance and hidden-index negative cases
        run: npm run test:checkout:v63
      - name: V64 build-file receipt tamper and runtime declaration unit regressions
        run: npm run test:provenance:v64
      - name: V56 genuine WAL SQLite and manifest-backed restored operator evidence (synthetic fixture)
        run: npm run test:release:real-files:v56
      - name: V50 offline interop and prebundle security regressions
        run: npm run test:interop
      - name: V52 channel image mapping drift and history safety
        run: npm run test:images:v52
      - name: V53 consented DNS-pinned CDN probe security tests
        run: npm run test:images:v53
      - name: V50 verify no browser-visible secrets before production bundling
        run: npm run build:preflight
      - name: Build Next.js App Router
        run: npm run build
      - name: V64 production Next.js process build SHA and digest loopback acceptance
        run: npm run test:runtime:v64
      - name: V49 real production restart with durable SQLite (loopback only)
        run: npm run test:production
      - name: V57 production Next.js boots from actual restored pre-V52 SQLite backup and restarts
        run: npm run test:staging:v57
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Browser E2E (synthetic local content, no paid API)
        run: npm run test:e2e
      - name: V64 CI diagnostic immutable Next files modified during synthetic browser tests
        run: |
          echo 'Files under .next modified after build receipt (excluding cache and traces):'
          find .next -type f -newer .next/content-studio-v64-build-receipt.json \
            -not -path '.next/cache/*' \
            -not -name 'trace' \
            -not -name 'trace-build' \
            -not -name 'trace-upload' | head -60
      - name: Start pinned local doocs/md 2.1.0 Docker editor
        run: |
          docker run -d --name content-studio-v51-doocs --pull=always \
            -p 127.0.0.1:8800:80 doocs/md:2.1.0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8800/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs content-studio-v51-doocs
          exit 1
      - name: V51–V52 real doocs text and image browser handoff
        run: npm run test:doocs:real
      - name: Stop doocs editor container
        if: always()
        run: docker rm -f content-studio-v51-doocs || true
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-v41-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: ignore
