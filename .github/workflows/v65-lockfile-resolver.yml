name: V65 Temporary Lockfile Resolver
on:
  push:
    branches: ['feat/v54-consolidated-integration-gate']
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve npm lockfile using registry and emit public dependency metadata
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(lock.lockfileVersion!==3 || lock.version!=='0.65.0' ||
             lock.packages?.['']?.version!=='0.65.0' ||
             !lock.packages?.['node_modules/next']?.integrity ||
             !lock.packages?.['node_modules/react']?.integrity) {
            throw Error('Resolved npm lockfile is incomplete');
          }
          const body=JSON.stringify(lock,null,2)+'\n';
          console.log('V65_LOCK_START_'+body.length);
          const escaped=JSON.stringify(body);
          for(let i=0;i<escaped.length;i+=500){
            console.log('V65_LOCK_PIECE_'+String(i/500).padStart(5,'0')+'_'+escaped.slice(i,i+500));
          }
          console.log('V65_LOCK_END_'+Math.ceil(escaped.length/500));
          NODE
