↗</h3><p>研究消息的真实出处、传播路径和证据缺口，然后形成你的观点。</p><div class="card-end"><span class="pill">热点雷达</span><span class="link-btn">发现选题 ${ic('arrow',14)}</span></div></div><div class="card lead-card action-hover" data-act="go-source" data-source="practice-1"><div class="type-mini">02 / 个人实践</div><h3>从一次实践开始 ↗</h3><p>整理真实项目里的经验与失败，只引用本人确认可以公开的信息。</p><div class="card-end"><span class="pill">真实经历</span><span class="link-btn">整理实践 ${ic('arrow',14)}</span></div></div></div><div class="callout green" style="margin-top:18px">${ic('spark',16)}<span>没有必要先完成所有设置。选择一个线索，我们会先帮你建立独立的写作 Brief。</span></div>`}<div class="section">${cardHead('为你精选的内容机会','模拟选题 · 非实时新闻')}<div class="two-grid">${sources.slice(0,2).map(x=>`<div class="card lead-card"><div class="row between"><span class="pill">${escape(x.tag)}</span><span class="tiny-muted">领域匹配 ${x.fit}%</span></div><h3>${escape(x.title)}</h3><p>${escape(x.reason)}</p><div class="card-end"><span class="pill cream">${x.type==='hot'?'需要补充证据':'需要公开授权'}</span><button class="link-btn" data-act="go-source" data-source="${x.id}">查看选题 ${ic('arrow',14)}</button></div></div>`).join('')}</div></div>${state.projects&&state.projects.length?`<div class="section">${cardHead('最近的文章','切换文章时不会覆盖工作稿')}<div class="card" style="padding:6px 20px">${state.projects.slice(0,5).map((p,i)=>`<div class="editorial-line"><span class="num">${String(i+1).padStart(2,'0')}</span><div style="flex:1;min-width:0"><strong>${escape(p.storyTitle)}</strong><small>主稿 v${p.masterVersion} · ${p.dirty?'包含未保存的工作稿':'已保存'}</small></div><button class="btn small" data-act="restore-article" data-id="${escape(p.articleId)}">切回文章</button></div>`).join('')}</div></div>`:''}<div class="section">${cardHead('你自己的创作节奏','比每日发布量更重要')}<div class="card" style="padding:18px 22px"><div class="editorial-line"><span class="num">01</span><div style="flex:1"><strong>发现值得研究的事</strong><small>不是热度高就应该写；先判断是否与你有关。</small></div><span class="pill gray">判断</span></div><div class="editorial-line"><span class="num">02</span> function allFeedDefs(){return [...feedDefinitions,...state.discCustom]}
function sourceActive(id){const src=allFeedDefs().find(f=>f.id===id);return src? (state.discDisabled.includes(id)?!src.enabled:src.enabled) :false}
function eventFeeds(x){return eventMeta[x.id]?.origins||[]}
function sourceAllowed(x){if(x.type==='practice')return sourceActive('practice');const os=eventFeeds(x),active=feedDefinitions.filter(f=>sourceActive(f.id)).map(f=>f.coverage);return os.some(o=>active.includes(o)||o==='AIHOT'&&active.includes('AIHOT'))}
function eventScore(x){const m=eventMeta[x.id],w=state.discWeights,total=Object.values(w).reduce((a,b)=>a+b,0)||1;return Math.round((m.problem*w.problem+m.personal*w.personal+m.evidence*w.evidence+m.momentum*w.momentum)/total)}
function filteredEvents(){const q=state.discQuery.trim().toLowerCase();let list=sources.filter(x=> x.type===state.sourceTab && sourceAllowed(x) && (!q||[x.title,x.desc,x.tag,x.reason,x.root,...eventFeeds(x)].join(' ').toLowerCase().includes(q)) && (state.discDomain==='all'||eventMeta[x.id].domain===state.discDomain) && (state.discOrigin==='all'||eventFeeds(x).includes(state.discOrigin)) && (state.discWindow==='all'||state.discWindow==='7d'&&(['24h','7d'].includes(eventMeta[x.id].window))||state.discWindow==='24h'&&eventMeta[x.id].window==='24h') && (!state.discOnlySaved||state.itemsSaved.includes(x.id)) && (!state.discOnlyFirst||x.type==='practice'||eventMeta[x.id].first.startsWith('1')));
 if(state.discSort==='latest')list.sort((a,b)=>eventMeta[a.id].fresh-eventMeta[b.id].fresh);
 else if(state.discSort==='trend')list.sort((a,b)=>eventMeta[b.id].momentum-eventMeta[a.id].momentum);
 else list.sort((a,b)=>eventScore(b)-eventScore(a));
 return list;
}
function sourceConsole(){const defs=allFeedDefs();return `<div class="ds-console-head"><div><span class="eyebrow">SOURCE REGISTRY</span><h2>每条信息都有明确的来路。</h2><p>这是一份接入设计与演示配置，并没有向外部平台发起抓取。新添加的订阅只保存在本机浏览器。</p></div><div class="ds-mini-note">${ic('shield',16)} 限流、条款与版权边界在正式接入时核实</div></div><div class="ds-source-table">${defs.map(f=>{const enabled=sourceActive(f.id);return `<div class="ds-source-row"><span class="ds-source-icon">${escape(f.icon)}</span><div class="ds-source-name"><b>${escape(f.name)}</b><small>${escape(f.kind)} · ${escape(f.route)}</small></div><div class="ds-source-purpose">${escape(f.note)}</div><span class="ds-level">${escape(f.priority)}</span><button class="ds-switch ${enabled?'checked':''}" role="switch" aria-label="${escape(f.name)} 是否纳入演示筛选" aria-checked="${enabled}" data-act="disc-toggle-source" data-id="${escape(f.id)}"><span></span></button>${f.url?`<a class="ds-visit" href="${escape(f.url)}" target="_blank" rel="noopener noreferrer" aria-label="打开 ${escape(f.name)} 文档">${ic('external',15)}</a>`:`<span class="ds-visit muted">${ic('lock',15)}</span>`}</div>`}).join('')}</div><div class="ds-add-source"><div><h3>添加自定义信息源</h3><p>只登记来源元信息，不进行联网抓取。之后由正式适配器验证 RSS / API 可达性。</p></div><form id="disc-source-form" class="ds-source-form"><label>名称<input id="disc-source-name" maxlength="60" placeholder="例如：我的产品更新订阅" required></label><label>RSS / 网站地址<input id="disc-source-url" type="url" placeholder="https://example.com/feed.xml" required></label><button class="btn primary" type="submit">${ic('plus',15)} 添加来源</button></form></div>`}
function weightingConsole(){let w=state.discWeights;const sample=sources.find(x=>x.id==='hot-1');const m=eventMeta[sample.id];return `<div class="ds-console-head"><div><span class="eyebrow">EDITORIAL SIGNALS</span><h2>让推荐理由透明，而不是只显示一个分数。</h2><p>权重仅影响这份演示样例的排序，不代表经过用户行为校准的真实模型。</p></div><button class="btn" data-act="disc-reset-weights">${ic('refresh',15)} 恢复默认</button></div><div class="ds-rule-grid"><div class="ds-rule-sliders">${Object.entries(DWLabels).map(([k,v])=>`<div class="ds-rule-slider"><div class="row between"><b>${escape(v)}</b><span>${Math.round((w[k]/(Object.values(w).reduce((a,b)=>a+b,0)||1))*100)}%</span></div><input type="range" min="0" max="60" step="5" aria-label="${escape(v)}权重" data-disc-weight="${k}" value="${w[k]}"></div>`).join('')}</div><div class="ds-rule-example"><div class="eyebrow">EXPLAINABLE SIGNALS / DEMO</div><h3>示例：${escape(sample.title)}</h3><div class="ds-rule-result"><strong>${eventScore(sample)}</strong><span>综合推荐示意分</span></div>${Object.entries(DWLabels).map(([k,v])=>`<div class="ds-signal-row"><span>${escape(v)}</span><div class="ds-signal-track"><i style="width:${m[k]}%"></i></div><b>${m[k]}</b></div>`).join('')}<div class="ds-example-foot">独立事实来源：${escape(m.independent)} · 转述：${escape(m.reprints)} · 尚缺：${escape(sample.gap)}</div></div></div><div class="callout caution" style="margin-top:20px">${ic('alert',16)}<span>排序分数不用于判定事实真实，也不应自动生成确定性结论；真正进入写作前需确认一手出处、引用与个人实验。</span></div>`}
function eventDetail(x){if(!x)return `<div class="ds-no-events"><h3>没有符合条件的事件</h3><p>调整时间、领域或来源筛选；也可以检查信息源是否被暂时排除。</p></div>`;const m=eventMeta[x.id],score=eventScore(x),saved=state.itemsSaved.includes(x.id);const notes=x.type==='practice';return `<div class="ds-detail-overline"><span class="eyebrow">${notes?'PERSONAL RECORD':'EVENT INTELLIGENCE'}</span><span class="ds-event-type">${notes?'私有素材':m.kind} · 情景样例</span></div><h2 class="ds-detail-title">${escape(x.title)}</h2><p class="ds-detail-desc">${escape(x.desc)}</p><div class="ds-summary-strip"><div><strong>${score}</strong><span>推荐分 · 示意</span></div><div><strong>${m.momentum}</strong><span>关注变化 · 示意</span></div><div><strong>${notes?'私有':m.independent.split(' ')[0]}</strong><span>${notes?'默认不公开':'来源/讨论记录'}</span></div></div><div class="ds-section-title"><b>${ic('spark',16)} 为什么值得你关注</b><span>推荐理由可审查</span></div><p class="ds-reason">${escape(x.reason)}</p><div class="ds-why-tags"><span>真实问题 ${m.problem}</span><span>个人相关 ${m.personal}</span><span>证据基础 ${m.evidence}</span></div><div class="ds-section-title"><b>${ic('layers',16)} ${notes?'素材与权限脉络':'事件来源关系'}</b><span>${notes?'私有边界':'不重复计数'}</span></div><div class="ds-provenance"><div class="ds-primary-origin"><span class="ds-origin-symbol">${ic(notes?'lock':'file',17)}</span><div><strong>${escape(x.root)}</strong><small>${notes?'仅在同意脱敏后进入公开稿件':escape(m.first)}</small></div><span class="ds-origin-label">${notes?'PRIVATE':'SOURCE'}</span></div><div class="ds-origin-grid"><div><span>独立来源/讨论</span><strong>${escape(m.independent)}</strong></div><div><span>关联转载</span><strong>${escape(m.reprints)}</strong></div><div><span>社区讨论</span><strong>${escape(m.discussion)}</strong></div></div><div class="ds-timeline">${m.timeline.map(([t,d])=>`<div><span class="ds-time">${escape(t)}</span><span class="ds-timeline-dot"></span><p>${escape(d)}</p></div>`).join('')}</div></div><div class="ds-risk">${ic('alert',17)}<div><strong>进入 Brief 前必须补足</strong><p>${escape(x.gap)}</p></div></div><div class="ds-section-title"><b>${ic('pen',16)} 可写的两个角度</b><span>作者选择，不自动发布</span></div><div class="ds-angles">${x.angles.map((a,i)=>`<div><span>0${i+1}</span><div><strong>${escape(a)}</strong><small>${i?'结合亲身实验与判断':'先建立事实与适用边界'}</small></div></div>`).join('')}</div><div class="ds-detail-footer"><button class="btn" data-act="save-source" data-source="${x.id}">${ic('bookmark',15)} ${saved?'已收藏 · 取消':'保存线索'}</button><button class="btn primary" data-act="create-from-source" data-source="${x.id}">基于此事件创建 Brief ${ic('arrow',16)}</button></div>`}
function discovery(){const events=filteredEvents(),selected=events.find(x=>x.id===state.selected)||events[0];const enabled=feedDefinitions.filter(f=>sourceActive(f.id)).length,allHot=sources.filter(x=>x.type==='hot').length;return `<div class="ds-page"><div class="ds-page-header"><div><div class="eyebrow">CONTENT DISCOVERY / PERSONAL EDITORIAL RADAR</div><h1 class="h1">先发现值得表达的问题。</h1><p class="lede">将行业信息、开源变更、社区痛点与个人实践汇集成可以追溯的选题，不把热度当事实。</p></div><button class="btn" data-act="disc-show-sources">${ic('sliders',16)} 信息源管理 <span class="ds-hint-count">${enabled}</span></button></div><div class="ds-demo-warning">${ic('info',16)}<span><strong>高保真设计数据。</strong>事件、时间、分数与来源关系均为情景样本；当前没有实时连接 AIHOT、GitHub 或其他平台。</span><button class="ds-text-link" data-act="disc-demo-refresh">重算样例排序</button></div><div class="ds-metrics"><div class="ds-metric"><span>聚合事件</span><strong>${allHot.toString().padStart(2,'0')}</strong><small>同一事件只展示一次</small></div><div class="ds-metric"><span>个人实践</span><strong>${sources.filter(x=>x.type==='practice').length.toString().padStart(2,'0')}</strong><small>私有素材独立保管</small></div><div class="ds-metric"><span>演示接入源</span><strong>${enabled.toString().padStart(2,'0')}</strong><small>纳入本地样例筛选</small></div><div class="ds-metric"><span>已收藏线索</span><strong>${state.itemsSaved.length.toString().padStart(2,'0')}</strong><small>可继续整理为 Brief</small></div></div><div class="ds-panel-nav"><div class="ds-panel-tabs"><button class="${state.discPanel==='events'?'selected':''}" data-act="disc-panel" data-panel="events">${ic('layers',15)} 聚合事件</button><button class="${state.discPanel==='sources'?'selected':''}" data-act="disc-panel" data-panel="sources">${ic('link',15)} 信源管理</button><button class="${state.discPanel==='rules'?'selected':''}" data-act="disc-panel" data-panel="rules">${ic('sliders',15)} 推荐规则</button></div><span class="ds-auto-note">${ic('shield',14)} 源头可追溯 · 人工负责判断</span></div>${state.discPanel==='sources'?`<div class="card ds-standalone">${sourceConsole()}</div>`:state.discPanel==='rules'?`<div class="card ds-standalone">${weightingConsole()}</div>`:`<div class="ds-feed-controls"><div class="ds-kind-tabs"><button data-act="source-tab" data-tab="hot" class="${state.sourceTab==='hot'?'selected':''}">${ic('radar',15)} 外部动态</button><button data-act="source-tab" data-tab="practice" class="${state.sourceTab==='practice'?'selected':''}">${ic('lock',15)} 个人实践</button></div><div class="ds-controls-right"><label class="ds-input-wrap">${ic('search',15)}<input id="disc-search" aria-label="搜索事件、来源、领域" placeholder="搜索问题、Agent、产品、来源…" value="${escape(state.discQuery)}"></label><button class="ds-save-filter ${state.discOnlySaved?'active':''}" data-act="disc-favorite-filter">${ic('bookmark',14)} 仅收藏</button></div></div><div class="ds-toolbar"><label>时间<select id="disc-window"><option value="all" ${state.discWindow==='all'?'selected':''}>全部</option><option value="24h" ${state.discWindow==='24h'?'selected':''}>24 小时</option><option value="7d" ${state.discWindow==='7d'?'selected':''}>近 7 天</option></select></label><label>领域<select id="disc-domain">${[['all','全部领域'],['Agent','Agent / Coding'],['桌面','桌面 AI'],['产品','产品体验'],['AI','AI 模型']].map(([id,name])=>`<option value="${id}" ${state.discDomain===id?'selected':''}>${name}</option>`).join('')}</select></label><label>来源<select id="disc-origin">${[['all','全部来源'],['AIHOT','AIHOT'],['GitHub','GitHub'],['HN','Hacker News'],['官方博客','官方博客'],['Reddit','Reddit'],['Product Hunt','Product Hunt'],['个人实践','个人实践']].map(([id,name])=>`<option value="${id}" ${state.discOrigin===id?'selected':''}>${name}</option>`).join('')}</select></label><label>排序<select id="disc-sort"><option value="relevance" ${state.discSort==='relevance'?'selected':''}>值得写优先</option><option value="trend" ${state.discSort==='trend'?'selected':''}>趋势变化</option><option value="latest" ${state.discSort==='latest'?'selected':''}>样例时间</option></select></label><button class="ds-preset ${state.discOnlyFirst?'active':''}" data-act="disc-first-filter">${ic('shield',14)} 仅含一手来源</button><button class="ds-reset" data-act="disc-reset-filter">重置筛选</button></div><div class="ds-discovery-layout"><section class="card ds-event-list"><div class="ds-list-head"><div><b>${events.length} 条${state.sourceTab==='hot'?'独立事件':'个人实践'}</b><span>来自演示样本 · 事件已聚合</span></div><span class="ds-sort-hint">推荐分为可解释的示意计算</span></div><div class="ds-event-stack">${events.length?events.map(x=>{let m=eventMeta[x.id],selectedCard=selected?.id===x.id,score=eventScore(x);return `<button class="ds-event-card ${selectedCard?'active':''}" data-act="select-source" data-source="${x.id}" aria-pressed="${selectedCard}"><div class="ds-event-top"><span class="ds-event-topic">${escape(m.domain)} · ${escape(m.kind)}</span><span class="ds-event-timing">${escape(x.age)}</span></div><h3>${escape(x.title)}</h3><p>${escape(x.desc)}</p><div class="ds-card-foot"><span class="ds-card-origin">${ic(x.type==='practice'?'lock':'layers',13)} ${escape(x.source)}</span><span class="ds-trend">${m.momentum>85?'↗ 趋势上升':'— 持续关注'}</span></div><div class="ds-card-scoring"><div class="ds-score-mini"><span>建议关注</span><strong>${score}</strong></div><span class="ds-evidence-mini">${x.type==='practice'?'私有':m.independent}</span><span class="ds-card-arrow">${ic('chev',16)}</span></div></button>`}).join(''):`<div class="ds-list-empty"><div>${ic('search',24)}</div><b>没有匹配内容</b><p>调整筛选条件，或查看其他来源。</p><button class="btn" data-act="disc-reset-filter">重置筛选</button></div>`}</div></section><section class="card ds-event-detail">${eventDetail(selected)}</section></div><div class="ds-bottom-hint">${ic('info',15)} 先保留原始链接、事件关系与证据缺口，再写观点。采集不等于获准转载全文；创建 Brief 不代表事实已通过审核。</div>`}</div>`}

function workspace(){let stageNames=[['brief','Brief'],['editor','主稿编辑'],['quality','内容核查'],['channels','渠道版本'],['layout','排版预览']];return `<div class="workspace-head"><div class="row between" style="flex-wrap:wrap"><span class="eyebrow">WRITING STUDIO / MASTER VERSION ${state.masterVersion}</span><div class="row"><span class="pill ${state.dirty?'cream':'gray'}">${state.dirty?'工作稿未保存':'主稿已保存 · v'+state.masterVersion}</span><button class="btn small" data-act="new-project">${ic('plus',13)} 新文章</button></div></div><h1 class="workspace-title">${escape(state.storyTitle)}</h1><div class="row" style="gap:18px;flex-wrap:wrap"><span class="tiny-muted">你的观点 · 真实证据 · 可控改写</span><span class="tiny-muted">${state.briefConfirmed?'Brief 已确认':'Brief 待确认'}</span><span class="tiny-muted">${state.draft.length} 字符</span></div></div><div class="wizard" role="tablist" aria-label="写作步骤">${stageNames.map(([id,label],i)=>`<button role="tab" aria-selected="${state.workspaceStep===id}" class="${state.workspaceStep===id?'active':i<stageIndex()?'done':''}" data-act="step" data-step="${id}"><span class="step-num">${String(i+1).padStart(2,'0')}</span>${label}</button>`).join('')}</div>${({brief:briefPage,editor:editorPage,quality:qualityPage,channels:channelsPage,layout:layoutPage})[state.workspaceStep]()}`}
function briefPage(){let b=state.brief;return `<div class="studio-grid"><div class="card pane"><div class="brief-header"><div><span class="eyebrow">01 / CONTENT BRIEF</span><h2 style="margin-top:7px">先想清楚要说什么。</h2></div><span class="pill ${state.briefConfirmed?'':'cream'}">${state.briefConfirmed?'已确认':'待确认'}</span></div><p class="lede" style="margin-bottom:23px">Brief 不是限制你的创作，而是让每一个观点都有读者、依据和表达边界。</p><div class="field-block"><label class="field-label" for="brief-audience">这篇文章写给谁？</label><input id="brief-audience" class="field-input" value="${escape(b.audience)}" placeholder="例如：刚开始实践 Agent 的开发者"><p class="field-help">尽量描述一个具体的读者群体。</p></div><div class="field-block"><label class="field-label" for="brief-stance">你最想让读者记住的判断</label><textarea id="brief-stance" class="field-area" placeholder="用一句话说出你的观点">${escape(b.stance)}</textarea></div><div class="field-block"><label class="field-label" for="brief-evidence">已经掌握的素材 / 仍需核实的事实</label><textarea id="brief-evidence" class="field-area">${escape(b.evidence)}</textarea><p class="field-help">请区分外部事实、他人的说法和你亲自验证的经验。</p></div><div class="field-block"><label class="field-label" for="brief-structure">文章结构</label><textarea id="brief-structure" class="field-area" style="min-height:135px">${escape(b.structure)}</textarea></div><div class="row" style="justify-content:flex-end;flex-wrap:wrap"><button class="btn subtle" data-act="brief-outline">${ic('spark',15)} 建议一个结构</button><button class="btn primary" data-act="brief-confirm">确认 Brief，进入写作 ${ic('arrow',15)}</button></div></div><aside class="card aside-pane"><span class="eyebrow">MATERIAL CONTEXT</span><h3 style="font-size:15px;margin:12px 0">写作时值得记住的边界</h3><div class="callout green">${ic('file',17)}<span>文章可以基于外部线索或个人实践，但个人经历必须由你确认，不能由 AI 编造。</span></div><div class="divider"></div><b style="font-size:12px">当前研究线索</b><div class="source-title" style="font-size:12px">${escape(currentSource().title)}</div><p class="source-desc">${escape(currentSource().gap)}</p><button class="btn small flat" data-act="nav" data-page="discover">${ic('radar',14)} 返回内容发现</button></aside></div>`}
function editorPage(){return `<div class="article-edit-shell ${state.assistant?'with-aside':''}"><div class="card" style="min-width:0;overflow:hidden"><div class="edit-tools"><div class="tool-group"><span class="pill ${state.dirty?'cream':'gray'}">${state.dirty?'未保存正文':'主稿 v'+state.masterVersion}</span><span class="tiny-muted">${state.draft.length} 字符</span></div><div class="tool-group"><button class="tool-quiet ${state.preview?'active':''}" data-act="toggle-preview">${ic('eye',14)} ${state.preview?'编辑':'预览'}</button><button class="tool-quiet" data-act="focus">${ic('focus',14)} ${state.focus?'退出专注':'专注'}</button><button class="tool-quiet ${state.assistant?'active':''}" data-act="assistant">${ic('spark',14)} ${state.assistant?'收起 AI':'AI 助手'}</button><button class="btn small" data-act="send-to-editor">同步到统一编辑器</button><button class="btn primary small" data-act="save-master">${ic('check',14)} 保存新版本</button></div></div><div class="paper"><span class="eyebrow">DRAFT / YOUR ORIGINAL VOICE</span><h2>${escape(state.storyTitle)}</h2><div class="paper-sub">写作对象：${escape(state.brief.audience)}　·　正文可直接编辑</div>${state.preview?`<div class="paper-preview">${escape(state.draft)}</div>`:`<textarea class="draft-editor" id="draft-text" spellcheck="false" aria-label="文章主稿正文" placeholder="在这里写下你的正文…">${escape(state.draft)}</textarea>`}</div><div style="border-top:1px solid var(--border);padding:12px 19px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="tiny-muted">${state.dirty?'你的修改尚未保存为新版本。':'已保存的主稿不会被 AI 建议静默覆盖。'}</span><button class="link-btn" data-act="step" data-step="quality">进入内容核查 ${ic('arrow',13)}</button></div></div>${state.assistant?`<aside class="card ai-pane"><div class="assistant-intro"><div class="ai-spark">${ic('spark',18)}</div><div><b>写作助手</b><div class="tiny-muted">AI 建议 · 由你决定</div></div><button class="icon-btn" style="margin-left:auto" data-act="assistant" aria-label="关闭助手">${ic('close',14)}</button></div><p class="source-desc" style="margin-bottom:16px">这里只生成可审阅的演示建议，不会自动修改你的文章。</p>${[['rewrite','把开头写得更具体'],['shorten','精简重复表达'],['continue','建议下一段']].map(([k,v])=>`<button class="ai-option" data-act="ai-propose" data-kind="${k}">${v} ${ic('chev',14)}</button>`).join('')}${state.aiSuggestion?`<div class="divider"></div><b style="font-size:12px">建议修改 · 对照</b><div class="diff-old">− ${escape(state.aiSuggestion.before)}</div><div class="diff-new">+ ${escape(state.aiSuggestion.after)}</div><div class="row" style="flex-wrap:wrap"><button class="btn small primary" data-act="ai-accept">接受建议</button><button class="btn small" data-act="ai-reject">拒绝</button></div><p class="field-help">接受后只会更改未保存正文；需要再次保存版本。</p>`:`<div class="callout green">${ic('info',15)}<span>选择一个任务后，修改建议会在这里显示原文与新文的差异。</span></div>`}</aside>`:''}</div>`}
function qualityPage(){let resolved=Object.values(state.issues).filter(Boolean).length;return `<div class="issues-grid"><div><div class="row between" style="margin:0 0 13px;flex-wrap:wrap"><div><h2 style="margin:0 0 3px;font-size:18px">让每一个判断都有边界。</h2><span class="tiny-muted">事实核验、引用与个人表达分开处理。以下均为演示问题。</span></div><span class="pill ${resolved===3?'':'cream'}">${resolved} / 3 已处理</span></div><div class="card issue"><div class="issue-top"><b>${ic('alert',15)} 未独立验证的效果描述</b><span class="pill ${state.issues.factual?'':'red'}">${state.issues.factual?'已改写':'重要风险'}</span></div><p>外部发布说明可以证明维护者说过什么，但不能直接证明实际性能或稳定性提升。</p><div class="quote">“引入了更明确的任务记录机制。”</div><div class="issue-actions"><button class="btn ${state.issues.factual?'subtle':'primary'} small" data-act="resolve-factual">${state.issues.factual?'重新检查表述':'改为有来源的陈述'}</button></div></div><div class="card issue"><div class="issue-top"><b>${ic('lock',15)} 个人实践与隐私边界</b><span class="pill ${state.issues.privacy?'':'cream'}">${state.issues.privacy?'已确认':'等待确认'}</span></div><p>文章可能提及个人项目经验。发布前必须确认没有内部路径、账号、客户信息或未经许可的日志。</p><div class="issue-actions"><button class="btn ${state.issues.privacy?'subtle':'primary'} small" data-act="resolve-privacy">${state.issues.privacy?'查看确认范围':'确认仅使用可公开内容'}</button></div></div><div class="card issue"><div class="issue-top"><b>${ic('spark',15)} 表达可以更加具体</b><span class="pill gray">${state.issues.style?'已处理':'可选建议'}</span></div><p>有些段落只讲“系统可靠性”，可以加一个明确的判断或操作例子。文风建议不影响发布许可。</p><div class="issue-actions"><button class="btn small" data-act="resolve-style">${state.issues.style?'已保留现有表达':'保留我的表达'}</button></div></div><div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="step" data-step="channels">进入渠道版本 ${ic('arrow',15)}</button></div></div><aside class="card aside-pane"><span class="eyebrow">QUALITY CONTROL</span><h3 style="font-size:16px">质检概况</h3><div class="row between" style="margin:10px 0"><span class="tiny-muted">已处理问题</span><b>${resolved} / 3</b></div><div class="meter"><span style="width:${resolved/3*100}%"></span></div><div class="divider"></div><div class="callout ${state.issues.factual&&state.issues.privacy?'green':'caution'}">${ic(state.issues.factual&&state.issues.privacy?'check':'alert',16)}<span>${state.issues.factual&&state.issues.privacy?'当前关键风险已由作者处理；如正文发生实质修改，需要重新核查。':'还有关键审查项未处理，公众号和知乎交付都会被阻止。'}</span></div><div class="divider"></div><b style="font-size:12px">什么不会发生？</b><p class="source-desc">不会报告伪精确的“AI 率”，不会根据一个来源给所有事实盖章，也不会替你确认未知事实。</p></aside></div>`}
function channelsPage(){const ch=state.channels[state.channel];return `<div class="channels-shell"><div class="card pane"><div class="row between" style="margin-bottom:18px;flex-wrap:wrap"><div><span class="eyebrow">04 / CHANNEL EDITION</span><h2 style="font-size:18px;margin:8px 0 0">给不同读者，写不同版本。</h2></div><span class="pill ${ch.dirty||ch.stale?'cream':'gray'}">${ch.dirty?'渠道稿未保存':ch.stale?'主稿有更新':'渠道稿 v'+ch.version}</span></div><div class="seg-tabs" style="margin-bottom:20px"><button class="${state.channel==='wechat'?'on':''}" data-act="channel" data-channel="wechat">微信公众号</button><button class="${state.channel==='zhihu'?'on':''}" data-act="channel" data-channel="zhihu">知乎</button></div>${ch.stale?`<div class="callout caution" style="margin-bottom:13px">${ic('alert',15)}<span>主稿已经有新的保存版本，当前渠道稿仍保留原来的人工表达。请显式对照或继续使用，不会自动覆盖。</span></div>`:''}<label for="channel-text" class="field-label">${state.channel==='wechat'?'公众号文章正文':'知乎文章正文'} · 独立可编辑</label><textarea id="channel-text" class="field-area channel-editor">${escape(ch.text)}</textarea><div class="row between" style="margin-top:13px;flex-wrap:wrap"><button class="btn" data-act="suggest-channel">${ic('layers',14)} ${ch.stale?'对照主稿修改':'查看渠道适配建议'}</button><button class="btn primary" data-act="save-channel">${ic('check',14)} 保存渠道版本</button></div><p class="field-help">主稿修改不会覆盖手工渠道稿；已经导出的历史快照也不会改变。</p></div><aside class="card aside-pane"><span class="eyebrow">VERSION RELATIONSHIP</span><h3 style="font-size:15px">一个观点，多种表达</h3><div class="card" style="padding:13px 15px;margin-top:13px;background:#FAFBF9"><div class="row between"><b>主稿 v${state.masterVersion}</b><span class="pill gray">来源</span></div><p class="source-desc" style="margin:7px 0 0">${escape(state.storyTitle)}</p></div><div style="display:flex;justify-content:center;padding:8px">${ic('arrow',15)}</div><div class="card" style="padding:13px 15px;background:#F5F9F5"><div class="row between"><b>${state.channel==='wechat'?'公众号':'知乎'}稿 v${ch.version}</b><span class="pill ${ch.stale?'cream':''}">${ch.stale?'需同步判断':'独立版本'}</span></div><p class="source-desc" style="margin:7px 0 0">人工修改将被保留</p></div><div class="divider"></div><button class="btn full" data-act="step" data-step="layout">下一步：排版预览 ${ic('arrow',14)}</button></aside></div>`}
function layoutPage(){const ch=state.channels[state.channel];return `<div class="channels-shell"><div class="card pane"><div class="row between" style="margin-bottom:17px;flex-wrap:wrap"><div><span class="eyebrow">05 / FORMAT PREVIEW</span><h2 style="font-size:18px;margin:8px 0 0">让文章在读者屏幕上好读。</h2></div><span class="pill cream">本地结构预览 · 未做平台验证</span></div><div class="row between" style="gap:12px;flex-wrap:wrap"><div class="seg-tabs" style="min-width:200px"><button class="${state.channel==='wechat'?'on':''}" data-act="channel" data-channel="wechat">公众号</button><button class="${state.channel==='zhihu'?'on':''}" data-act="channel" data-channel="zhihu">知乎</button></div><div class="seg-tabs"><button class="${state.layoutDevice==='phone'?'on':''}" data-act="device" data-device="phone">手机</button><button class="${state.layoutDevice==='desktop'?'on':''}" data-act="device" data-device="desktop">桌面</button></div></div><div class="row" style="gap:8px;margin-top:13px;flex-wrap:wrap"><span class="tiny-muted">预览风格</span>${[['reading','舒展阅读'],['plain','极简'],['tech','技术文章']].map(([k,v])=>`<button class="btn small ${state.layoutTheme===k?'subtle':''}" data-act="theme" data-theme="${k}">${v}</button>`).join('')}</div><div class="preview-frame ${state.layoutDevice} theme-${state.layoutTheme}"><div class="eyebrow" style="font-size:9px;margin-bottom:17px">${state.channel==='wechat'?'CONTENT STUDIO · 微信公众号':'CONTENT STUDIO · 知乎'}</div><h2>${escape(state.storyTitle)}</h2><div class="tiny-muted" style="margin-bottom:19px">作者 · 原创观点与实践笔记</div><p>${escape(ch.text)}</p></div></div><aside class="card aside-pane"><span class="eyebrow">DELIVERY CHECKLIST</span><h3 style="font-size:15px">发布前还需要确认什么？</h3><div class="callout caution" style="margin:14px 0 18px">${ic('info',16)}<span>平台可能改变粘贴后的样式。这里仅验证本地阅读效果，不代表公众号或知乎后台兼容通过。</span></div>${['标题层级与段落','引用及出处','图片与替代文字','代码块和表格','超链接','平台内最终预览'].map((txt,i)=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--border)"><span class="tiny-muted" style="min-width:21px">0${i+1}</span><span style="font-size:11px">${txt}</span><span class="pill gray" style="margin-left:auto">待平台检查</span></div>`).join('')}<button class="btn full" style="margin-top:18px" data-act="copy-channel">${ic('copy',14)} 复制当前渠道纯文本</button><button class="btn primary full" style="margin-top:9px" data-act="nav" data-page="publish">前往交付中心 ${ic('arrow',14)}</button></aside></div>`}
function blockers(channel){const c=state.channels[channel],arr=[];if(!state.briefConfirmed)arr.push('Brief 尚未确认');if(state.dirty)arr.push('主稿存在未保存修改');if(!state.issues.factual)arr.push('重要事实边界待核查');if(!state.issues.privacy)arr.push('隐私和素材权限待确认');if(c.dirty)arr.push('渠道稿有未保存修改');if(c.stale)arr.push('主稿更新后，渠道版本需人工判断');if(c.checks.some(v=>!v))arr.push('发布前四项人工核对未完成');return arr}
function publishPage(){let channels=[['wechat','微信公众号'],['zhihu','知乎']];return `<div class="eyebrow">PUBLISHING / HUMAN CONTROL</div><div class="row between" style="align-items:end;flex-wrap:wrap"><div><h1 class="h1">发布之前，再确认一次。</h1><p class="lede">你的文章将在这里准备交付。所有动作都是本地演示，不会真的发送到平台。</p></div><span class="pill cream">首发渠道 · 人工交付</span></div><div class="callout green" style="margin:23px 0">${ic('info',16)}<span>公众号与知乎各自独立复核。文件导出 ≠ 平台已发表；填写外部文章链接也只是作者登记，未做自动核验。</span></div><div class="publish-grid">${channels.map(([key,label])=>{let ch=state.channels[key],bs=blockers(key),ready=!bs.length;return `<div class="card publish-card"><div class="row between" style="margin-bottom:12px"><div class="row"><span style="width:35px;height:35px;border-radius:10px;background:#EEF3ED;display:grid;place-items:center;color:var(--primary)">${ic(key==='wechat'?'file':'pen',18)}</span><div><b style="font-size:15px">${label}</b><div class="tiny-muted">渠道稿 v${ch.version} · 独立检查</div></div></div><span class="pill ${ready?'':'cream'}">${ch.status==='reported'?'作者已登记':ch.status==='exported'?'本地已导出':ready?'可导出':'待检查'}</span></div><div class="status-line">${ic(ready?'check':'shield',17)}<span>${ready?'当前版本已完成本地发布前检查。':'还有 '+bs.length+' 项影响当前渠道交付。'}</span></div><h3 style="font-size:12px;margin:18px 0 12px">当前版本复核</h3>${['重要事实和来源','隐私与引用权利','渠道版本及排版','最终通读确认'].map((s,i)=>`<label class="review-check"><input type="checkbox" data-action="publish-check" data-channel="${key}" data-index="${i}" ${ch.checks[i]?'checked':''}><span>${s}</span></label>`).join('')}<div class="divider"></div>${bs.length?`<div class="callout caution" style="margin-bottom:15px">${ic('alert',15)}<span>${escape(bs.filter(s=>s!=='发布前四项人工核对未完成').slice(0,2).join('；')||'请完成以上四项人工复核。')}</span></div>`:''}<div class="row" style="flex-wrap:wrap"><button class="btn primary" data-act="export-channel" data-channel="${key}" ${!ready?'disabled title="请先完成本渠道的发布前检查"':''}>${ic('download',14)} 导出 HTML</button><button class="btn" data-act="export-txt" data-channel="${key}" ${!ready?'disabled title="请先完成本渠道的发布前检查"':''}>TXT</button><button class="btn" data-act="report-channel" data-channel="${key}" ${ch.status!=='exported'&&ch.status!=='reported'?'disabled title="请先生成本地交付文件"':''}>${ic('external',14)} 登记发表</button></div>${ch.status==='reported'?`<p class="field-help">${ic('info',13)} 作者已登记：${escape(ch.url)}。平台尚未独立核验。</p>`:''}</div>`}).join('')}</div><div class="section">${cardHead('交付与历史快照','旧的本地导出不会随着正文修改而被覆盖')}<div class="card" style="padding:8px 20px">${state.history.length?state.history.map(h=>`<div class="editorial-line"><span style="color:var(--primary)">${ic('file',19)}</span><div style="flex:1"><strong>${h.channel==='wechat'?'公众号':'知乎'} · ${escape(h.title)}</strong><small>主稿 v${h.master} / 渠道稿 v${h.variant} · ${escape(h.time)}</small></div><span class="pill gray">本地快照</span></div>`).join(''):`<div class="empty" style="border:0"><h3>还没有交付快照</h3><p>完成审核后导出的本地文件会在这里留下记录。</p></div>`}</div></div>`}
function insightsPage(){return `<div class="eyebrow">INSIGHTS / LEARNING LOOP</div><h1 class="h1">读者的反馈，成为下一次表达的起点。</h1><p class="lede">观察真实问题，而不是只追逐数字。以下为演示数据，不代表你的实际运营表现。</p><div class="insight-grid" style="margin-top:26px"><div class="card pane"><div class="row between"><div><b style="font-size:15px">内容观察</b><div class="tiny-muted">过去 7 天 · 模拟趋势</div></div><span class="pill gray">演示数据</span></div><div class="row" style="gap:10px;margin:21px 0 8px"><div class="metric" style="flex:1"><b>2,480</b><small>模拟阅读</small></div><div class="metric" style="flex:1"><b>126</b><small>模拟收藏</small></div><div class="metric" style="flex:1"><b>18</b><small>模拟评论</small></div></div><div class="bars">${[38,52,43,78,67,94,75].map((v,i)=>`<div class="bar-wrap"><div class="bar" style="height:${v}%"></div><small>${['一','二','三','四','五','六','日'][i]}</small></div>`).join('')}</div><div class="callout green" style="margin-top:25px">${ic('chart',16)}<span>这里的数字只能代表示例观察。正式产品需要记录统计来源、观察窗口和渠道口径，不能从小样本直接推断内容效果。</span></div></div><div class="card pane"><span class="eyebrow">READER SIGNALS</span><h2 style="font-size:18px;margin:10px 0 10px">值得认真回答的提问</h2><div class="feedback"><div class="fb-head"><span>文章评论 · 模拟</span><span>知乎</span></div><p>“你提到 Agent 需要执行证据，有没有一个能跑起来的最小案例？”</p><button class="btn small ${state.feedbackUsed?'subtle':'primary'}" data-act="feedback-brief">${state.feedbackUsed?'已进入选题':'转成下一篇选题'} ${ic('arrow',13)}</button></div><div class="feedback"><div class="fb-head"><span>讨论回复 · 模拟</span><span>公众号</span></div><p>“这种记录机制会不会反过来增加长任务的开销？我更希望看到权衡。”</p><button class="link-btn" data-act="feedback-brief">研究这个问题 ${ic('arrow',13)}</button></div></div></div>`}
function content(){return ({home:homepage,discover:discovery,create:workspace,publish:publishPage,insights:insightsPage})[state.page]()}
function modal(){if(!state.modal)return '';const m=state.modal;let inner='';if(m==='settings'){inner=`<h3>原型演示设置</h3><p>这是独立的高保真交互稿。演示数据只保存在当前浏览器，重新打开仍可继续，除非清除数据。</p><div class="callout caution">${ic('info',16)}<span>AI 建议、热点信息、数据分析与发布操作均为模拟，不连接真实模型、平台或账户。</span></div><div class="row" style="margin-top:22px;justify-content:space-between;flex-wrap:wrap"><button class="btn danger" data-act="reset">重置所有演示数据</button><button class="btn primary" data-act="modal-close">返回工作台</button></div>`}else if(m==='practice-consent'){inner=`<h3>确认实践素材的公开边界</h3><p>这个实践线索来自私人项目记录。原始日志和内部路径默认不可进入公开文章。</p><label class="checkbox-line"><input id="practice-confirm" type="checkbox"> 我只允许使用可公开、已脱敏的实践摘要</label><div class="row" style="justify-content:flex-end;margin-top:22px"><button class="btn" data-act="modal-close">返回检查</button><button class="btn primary" data-act="confirm-practice">确认并创建 Brief</button></div>`}else if(m.startsWith('report:')){let key=m.split(':')[1];inner=`<h3>登记${key==='wechat'?'公众号':'知乎'}的外部发表</h3><p>请先在目标平台自行发表，再登记文章地址。这只能表明作者报告了发表，系统没有独立验证。</p><label class="field-label" for="publish-url">平台文章链接</label><input id="publish-url" class="field-input" type="url" placeholder="https://…" value="${escape(state.channels[key].url)}"><div class="row" style="justify-content:flex-end;margin-top:21px"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-act="confirm-report" data-channel="${key}">保存作者登记</button></div>`}else if(m==='search'){inner=`<h3>搜索内容与选题</h3><p>搜索演示来源。选择结果后可查看来源脉络和写作角度。</p><input autofocus id="modal-search" class="field-input" placeholder="输入 Agent、工具、产品…"><div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn primary" data-act="confirm-search">前往搜索 ${ic('arrow',14)}</button></div>`}else if(m==='overwrite'){inner=`<h3>比较主稿与渠道稿</h3><p>主稿有变更，但当前渠道稿已独立编辑。请明确选择，不能自动覆盖已有表达。</p><div class="callout caution">${ic('alert',16)}<span>选择“用主稿创建新渠道版本”会替换当前尚未发布的渠道工作稿；旧的交付快照不受影响。</span></div><div class="row" style="justify-content:flex-end;flex-wrap:wrap;margin-top:20px"><button class="btn" data-act="keep-channel">保留渠道表达</button><button class="btn primary" data-act="sync-channel">用主稿创建新渠道版本</button></div>`}return `<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="操作确认">${inner}</section></div>`}
function render(){app.innerHTML=`<div class="app">${header()}</div>`;if(state.page==='create'&&state.focus){document.querySelector('.sidebar')?.setAttribute('style','display:none');document.querySelector('.main')?.setAttribute('style','margin-left:0;width:100%')}}
function saveMaster(){if(!state.dirty){showToast('当前主稿没有需要保存的新修改');return}state.savedDraft=state.draft;state.masterVersion++;state.dirty=false;state.aiSuggestion=null;state.issues.factual=false;state.issues.privacy=false;for(const c of Object.values(state.channels)){c.stale=true;c.checks=[false,false,false,false]}persist();render();showToast(`主稿 v${state.masterVersion} 已保存；相关渠道稿需重新核查`)}
function createFromSource(src){state.selected=src.id;if(src.type==='practice'){state.modal='practice-consent';render();return}initializeArticle(src)}
function snapshotCurrent(){if(!state.articleId||!state.storyTitle)return;const props=['articleId','storyTitle','brief','briefConfirmed','draft','savedDraft','masterVersion','dirty','aiSuggestion','issues','channels','selected'];const o={};for(const prop of props)o[prop]=structuredClone(state[prop]);state.projects=state.projects||[];state.projects=state.projects.filter(p=>p.articleId!==o.articleId);state.projects.unshift(o);state.projects=state.projects.slice(0,15)}
function restoreArticle(id){const match=(state.projects||[]).find(p=>p.articleId===id);if(!match)return;snapshotCurrent();state.projects=state.projects.filter(p=>p.articleId!==id);for(const [k,v] of Object.entries(match))state[k]=structuredClone(v);state.workspaceStep='editor';navigate('create','editor');showToast('已切换文章，上一份工作稿已保留')}
function initializeArticle(src){snapshotCurrent();state.importedBriefId='';state.articleId='a'+Date.now();state.storyTitle=src.angles[0].replace(/[？?]$/,'');state.brief={audience:src.type==='hot'?'关注 AI、Agent 与产品实践的开发者':'关注独立开发与真实产品实践的读者',stance:src.type==='hot'?'我认为这项变化真正值得关注的是能否解决实际工程问题，而非宣传中的功能数量。':'一次真实实践中的失败往往比抽象的方法论更有解释力。',evidence:((eventMeta[src.id] ? '线索来源：'+src.root+'\n渠道：'+eventMeta[src.id].origins.join(' / ')+'\n' : '') + '需要核验：'+src.gap),structure:'1. 问题出现的背景\n2. 已有的事实与证据\n3. 我的判断与实际建议'};state.briefConfirmed=false;state.draft='';state.savedDraft='';state.masterVersion=0;state.dirty=false;state.aiSuggestion=null;state.issues={factual:false,privacy:src.type==='hot',style:false};state.channels={wechat:{text:'',saved:'',dirty:false,version:0,stale:false,checks:[false,false,false,false],status:'draft',url:''},zhihu:{text:'',saved:'',dirty:false,version:0,stale:false,checks:[false,false,false,false],status:'draft',url:''}};state.firstUse=true;state.workspaceStep='brief';navigate('create','brief');showToast('已为该线索建立独立 Brief，不会修改以前的文章')}
function articleStarter(){return `${state.brief.stance}\n\n${state.brief.evidence}\n\n我倾向于先回答一个具体问题：它究竟改善了哪一个真实场景？\n\n接下来还需要补充可验证的实例与适用边界，才能形成完整结论。`}

function renderDeliveryHTML(k){const c=state.channels[k];return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>${escape(state.storyTitle)}</title></head><body style="max-width:700px;padding:30px 20px;margin:auto;font:16px/1.9 Arial,'Microsoft YaHei',sans-serif;color:#263B2F"><h1>${escape(state.storyTitle)}</h1>${escape(c.saved).split('\n\n').map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}<a href="/knowledge" aria-label="打开研究知识库" style="position:fixed;right:18px;bottom:18px;z-index:95;border-radius:10px;padding:10px 14px;background:#315e46;color:white;text-decoration:none;font:600 12px sans-serif;box-shadow:0 4px 15px #16382325">研究知识库 ↗</a></body></html>`}
function handleAction(el){const action=el.dataset.act;const key=el.dataset.channel;
 if(action==='disc-panel'||action==='disc-show-sources'){state.discPanel=action==='disc-show-sources'?'sources':el.dataset.panel;persist();render();return}
 if(action==='disc-toggle-source'){const id=el.dataset.id;state.discDisabled=state.discDisabled.includes(id)?state.discDisabled.filter(x=>x!==id):[...state.discDisabled,id];persist();render();showToast('已更新演示信息源筛选；没有发生联网同步');return}
 if(action==='disc-reset-weights'){state.discWeights=structuredClone(defaultDW);persist();render();return}
 if(action==='disc-favorite-filter'){state.discOnlySaved=!state.discOnlySaved;persist();render();return}
 if(action==='disc-first-filter'){state.discOnlyFirst=!state.discOnlyFirst;persist();render();return}
 if(action==='disc-demo-refresh'){state.discDemoRound++;persist();render();showToast('已重新计算本地情景样本，未连接外部数据');return}
 if(action==='disc-reset-filter'){state.discQuery='';state.discOrigin='all';state.discDomain='all';state.discWindow='all';state.discSort='relevance';state.discOnlySaved=false;state.discOnlyFirst=false;persist();render();return}
 switch(action){case'nav':navigate(el.dataset.page,el.dataset.step||undefined);return;case'step':state.workspaceStep=el.dataset.step;persist();render();return;case'source-tab':state.sourceTab=el.dataset.tab;state.selected=sources.find(x=>x.type===state.sourceTab)?.id;state.query='';persist();render();return;case'select-source':state.selected=el.dataset.source;persist();render();return;case'go-source':state.selected=el.dataset.source;state.sourceTab=currentSource().type;navigate('discover');return;case'clear-query':state.query='';persist();render();return;case'create-from-source':createFromSource(sources.find(x=>x.id===el.dataset.source));return;case'restore-article':restoreArticle(el.dataset.id);return;case'new-project':initializeArticle({type:'hot',angles:['一篇新的原创文章'],gap:'请填写你真正掌握的来源和证据。'});state.storyTitle='一篇新的原创文章';state.brief={audience:'',stance:'',evidence:'',structure:''};state.briefConfirmed=false;persist();render();return;case'save-source':{const id=el.dataset.source;state.itemsSaved=state.itemsSaved.includes(id)?state.itemsSaved.filter(x=>x!==id):[...state.itemsSaved,id];persist();render();showToast(state.itemsSaved.includes(id)?'已收藏该研究线索':'已取消收藏');return}case'brief-outline':state.brief.structure='1. 一个真实的问题或变化\n2. 有出处的事实与未解决的问题\n3. 作者的实践和判断\n4. 读者可以采取的下一步';state.briefConfirmed=false;persist();render();showToast('已生成演示结构建议，请自行调整后确认');return;case'brief-confirm':{const b=state.brief;if(!b.audience.trim()||!b.stance.trim()){showToast('请先填写目标读者和核心判断');return}state.briefConfirmed=true;if(!state.draft.trim()){state.draft=articleStarter();state.dirty=true}state.workspaceStep='editor';persist();render();showToast('Brief 已确认，主稿工作区已准备好');return}case'assistant':state.assistant=!state.assistant;persist();render();return;case'toggle-preview':state.preview=!state.preview;render();return;case'focus':state.focus=!state.focus;render();return;case'ai-propose':{const kind=el.dataset.kind;let before='',after='';if(kind==='rewrite'){before='最近在做桌面 Agent 的时候，我反复遇到一个问题';after='上周，一次桌面 Agent 任务执行到第三步就失去了可追溯性。这让我开始重新审视任务记录的设计'}else if(kind==='shorten'){before='在我看来，Agent 的能力上限取决于模型';after='模型决定 Agent 能走多远，执行系统决定我们能否信任它'}else{before='文章结尾缺少一个可操作的建议';after='更可靠的下一步，不是立刻升级模型，而是先记录每次工具调用的输入、结果和失败原因。'}state.aiSuggestion={kind,before,after};persist();render();return}case'ai-accept':{let sug=state.aiSuggestion;if(!sug)return;if(sug.kind==='continue')state.draft+='\n\n'+sug.after;else if(state.draft.includes(sug.before))state.draft=state.draft.replace(sug.before,sug.after);else state.draft+='\n\n'+sug.after;state.dirty=true;state.aiSuggestion=null;persist();render();showToast('建议已应用到未保存正文；请保存新版本');return}case'ai-reject':state.aiSuggestion=null;persist();render();showToast('已拒绝建议，正文未变动');return;case'save-master':saveMaster();return;case'resolve-factual':state.issues.factual=true;if(state.draft.includes('这次开源 Agent 框架的更新')){state.draft=state.draft.replace('这次开源 Agent 框架的更新','根据项目维护者公开发布的更新说明，此次框架更新');state.dirty=true}persist();render();showToast('已将结论限定为来源声明；若正文被修改，请保存并重新核查');return;case'resolve-privacy':state.modal='privacy';render();return;case'resolve-style':state.issues.style=true;persist();render();showToast('已保留你的表达，风格建议不阻塞交付');return;case'channel':state.channel=el.dataset.channel;persist();render();return;case'save-channel':{let c=state.channels[state.channel];if(!c.text.trim()){showToast('渠道稿为空，请先填写内容');return}c.saved=c.text;c.dirty=false;c.version++;c.checks=[false,false,false,false];c.status='draft';persist();render();showToast('已保存本渠道版本；发布前确认已重置');return}case'suggest-channel':state.modal='overwrite';render();return;case'keep-channel':state.channels[state.channel].stale=false;state.channels[state.channel].checks=[false,false,false,false];state.modal=null;persist();render();showToast('已保留人工渠道表达，请复核可能过时的事实');return;case'sync-channel':{let c=state.channels[state.channel];c.text=state.draft;c.saved=state.draft;c.dirty=false;c.stale=false;c.version++;c.checks=[false,false,false,false];c.status='draft';state.modal=null;persist();render();showToast('已创建新的渠道版本，旧的交付快照未被修改');return}case'device':state.layoutDevice=el.dataset.device;persist();render();return;case'theme':state.layoutTheme=el.dataset.theme;persist();render();return;case'copy-channel':{const text=state.channels[state.channel].text;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showToast('已复制当前渠道正文；粘贴到平台后请逐项回查')).catch(()=>showToast('当前浏览器不允许剪贴板访问，请手动选择正文复制'))}else{showToast('当前浏览器不允许剪贴板访问，请手动选择正文复制')}return}case'export-txt':{if(blockers(key).length){showToast('请先完成当前渠道审核');return}let c=state.channels[key];downloadFile(`content-studio-${key}-v${c.version}.txt`,state.storyTitle+'\n\n'+c.saved,'text/plain;charset=utf-8');c.status='exported';state.history.unshift({channel:key,master:state.masterVersion,variant:c.version,title:state.storyTitle,time:new Date().toLocaleString('zh-CN',{hour12:false})});persist();render();showToast('已导出纯文本，未向任何平台发表');return}case'export-channel':{if(blockers(key).length){showToast('请先处理当前渠道的全部阻塞项');return}let c=state.channels[key];downloadFile(`content-studio-${key}-v${c.version}.html`,renderDeliveryHTML(key),'text/html;charset=utf-8');c.status='exported';state.history.unshift({channel:key,master:state.masterVersion,variant:c.version,title:state.storyTitle,time:new Date().toLocaleString('zh-CN',{hour12:false})});persist();render();showToast('已生成本地交付文件；并未向平台发布');return}case'report-channel':state.modal='report:'+key;render();return;case'confirm-report':{let value=document.getElementById('publish-url')?.value.trim()||'';try{const u=new URL(value);if(!/^https?:$/.test(u.protocol))throw Error('invalid')}catch{showToast('请填写有效的 http(s) 文章地址');return}let c=state.channels[key];c.url=value;c.status='reported';state.modal=null;persist();render();showToast('已记录作者报告的发表链接；平台尚未独立核验');return}case'feedback-brief':state.feedbackUsed=true;initializeArticle({type:'hot',angles:['用一个最小实例，解释 Agent 的执行证据'],gap:'需要补充可公开的代码、运行环境与复现记录。'});showToast('已由读者问题创建新选题；仍需作者补齐证据');return;case'modal':state.modal=el.dataset.modal;render();return;case'modal-close':state.modal=null;render();return;case'search-open':state.modal='search';render();document.getElementById('modal-search')?.focus();return;case'confirm-search':state.query=document.getElementById('modal-search')?.value||'';state.sourceTab='hot';state.selected='hot-1';navigate('discover');return;case'confirm-practice':if(!document.getElementById('practice-confirm')?.checked){showToast('请先确认只能使用可公开的脱敏摘要');return}state.modal=null;initializeArticle(currentSource());state.issues.privacy=true;persist();render();return;case'reset':localStorage.removeItem('contentstudio_hifi_v21');state=structuredClone(initial);state.modal=null;render();showToast('已重置为初始演示内容');return}}
// Dedicated privacy dialog generated alongside other modal bodies
const oldModal=modal;modal=function(){if(state.modal==='privacy')return `<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="确认隐私"><h3>确认文章的公开边界</h3><p>请只在文章中使用你明确允许公开、已脱敏的个人经验。这个选择是原型演示中的人工确认，不代表系统已经自动识别了全部敏感信息。</p><label class="checkbox-line"><input type="checkbox" id="privacy-check"> 我已检查并确认本稿没有未经许可的私有内容</label><div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-act="privacy-confirm">确认</button></div></section></div>`;return oldModal()};
app.addEventListener('click',e=>{const el=e.target.closest('[data-act="send-to-editor"]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();(async()=>{if(state.dirty){showToast('请先保存主稿，避免上传未保存的文字');return}if(!confirm('把当前保存的主稿复制到本地统一编辑器？不会自动发送到外部平台。'))return;const paragraphs=(state.savedDraft||'').split(/\n\s*\n/).map(text=>({text:text.trim()})).filter(x=>x.text.length>=3).slice(0,24);if(!paragraphs.length){showToast('请先完成主稿正文');return}const r=await fetch('/api/editor/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:state.storyTitle,briefId:state.importedBriefId||'',paragraphs})});const json=await r.json();if(!r.ok)throw Error(json.error||'导入失败');location.href='/editor?project='+encodeURIComponent(json.id)})().catch(x=>showToast(x.message))},true);
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){handleAction(el);return}if(e.target.id==='backdrop'){state.modal=null;render()}});
app.addEventListener('click',e=>{const el=e.target.closest('[data-act="privacy-confirm"]');if(!el)return;if(!document.getElementById('privacy-check')?.checked){showToast('请先确认公开与脱敏范围');return}state.issues.privacy=true;state.modal=null;persist();render();showToast('人工隐私确认已记录；内容变更后仍应重新检查')},true);
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='publish-check'){let c=state.channels[el.dataset.channel];c.checks[Number(el.dataset.index)]=el.checked;persist();render()}});
app.addEventListener('submit',e=>{if(e.target.id!=='disc-source-form')return;e.preventDefault();const name=document.getElementById('disc-source-name')?.value.trim(),raw=document.getElementById('disc-source-url')?.value.trim();let url;try{url=new URL(raw);if(!['https:','http:'].includes(url.protocol))throw Error('protocol')}catch{showToast('请输入有效的 http(s) 地址');return}if(!name){showToast('请填写来源名称');return}if(allFeedDefs().some(f=>f.url&&f.url===url.href)){showToast('该来源已登记，不能重复添加');return}state.discCustom.push({id:'custom-'+Date.now(),name,icon:'RSS',kind:'自定义订阅',route:'待验证',url:url.href,priority:'P2',note:'仅本地登记；需要适配器与接入审核',enabled:false,coverage:'自定义'});persist();render();showToast('已登记为本地候选来源，未发生网络抓取')});
app.addEventListener('change',e=>{const el=e.target;const map={'disc-window':'discWindow','disc-domain':'discDomain','disc-origin':'discOrigin','disc-sort':'discSort'};if(map[el.id]){state[map[el.id]]=el.value;persist();render()}});
app.addEventListener('input',e=>{const el=e.target;if(el.dataset.discWeight){state.discWeights[el.dataset.discWeight]=Number(el.value);persist();const scroll=window.scrollY;render();window.scrollTo(0,scroll);return}if(el.id==='disc-search'){state.discQuery=el.value;const pos=el.selectionStart;persist();render();const n=document.getElementById('disc-search');n?.focus();n?.setSelectionRange(pos,pos);return}});
app.addEventListener('input',e=>{const el=e.target;if(el.id==='source-query'){state.query=el.value;persist();const pos=el.selectionStart;render();const n=document.getElementById('source-query');n?.focus();n?.setSelectionRange(pos,pos);return}if(el.id==='draft-text'){state.draft=el.value;state.dirty=state.draft!==state.savedDraft;persist();const p=document.querySelector('.edit-tools .pill');if(p){p.textContent=state.dirty?'未保存正文':'主稿 v'+state.masterVersion;p.className='pill '+(state.dirty?'cream':'gray')}const count=document.querySelector('.edit-tools .tiny-muted');if(count)count.textContent=state.draft.length+' 字符';return}if(el.id==='channel-text'){const c=state.channels[state.channel];c.text=el.value;c.dirty=c.text!==c.saved;persist();return}const bm={'brief-audience':'audience','brief-stance':'stance','brief-evidence':'evidence','brief-structure':'structure'};if(bm[el.id]){state.brief[bm[el.id]]=el.value;state.briefConfirmed=false;persist();return}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.modal='search';render();document.getElementById('modal-search')?.focus()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(state.page==='create'&&state.workspaceStep==='channels')handleAction({dataset:{act:'save-channel'}});else saveMaster()}if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
// V22 server-side event handoff: keep all old projects separate and start from an unverified Brief.
const imported=new URLSearchParams(location.search).get('brief');
if(imported && /^br_[a-f0-9]{24}$/.test(imported)){
 fetch('/api/briefs/'+encodeURIComponent(imported)).then(r=>{if(!r.ok)throw Error('Brief not found');return r.json()}).then(b=>{
   const src={id:'external-'+imported,type:'hot',title:b.title,root:'源数据快照',gap:b.warning||'待逐条核实原始来源',angles:[b.title]};
   initializeArticle(src);
   state.storyTitle=b.title;
   state.importedBriefId=b.id;state.brief.audience=b.audience;
   state.brief.stance='请基于第一手证据与个人实践写出你的独立判断。';
   state.brief.evidence=(b.sourceItems||[]).map(x=>x.sourceId+' ['+x.role+'] '+x.url).join('\n')+'\n\n待核验：'+b.warning;
   if(b.verification){
     const v=b.verification;
     state.brief.evidence+='\n\n=== V24 作者研究快照（'+v.snapshotAt+'） ===\n假设：'+v.hypothesis+'\n状态：'+v.status+'\n结论：'+(v.conclusion||'尚未定论')+'\n下一步：'+(v.nextAction||'继续核验')+'\n一手记录：'+v.evidence.filter(e=>['reproduction','user_interview','usage_observation'].includes(e.kind)).length+' 条；用户需求已独立确认：否（均为作者记录，无法自动推断普遍性）';
     state.brief.evidence+='\n证据记录：\n'+v.evidence.map(e=>e.kind+' ['+e.result+'] '+e.observation).join('\n');
     if(v.status==='rejected')state.brief.stance='该研究假设已被作者驳回；只能写纠错或反思文章，不得当作成立的需求描述。';
   }
   state.briefConfirmed=false;state.issues.factual=false;state.issues.privacy=false;
   persist();render();history.replaceState(null,'','/app');
 }).catch(err=>console.warn('Brief handoff unavailable',err));
}
render();
})();
