function discoverView(){const cards=demoStories.filter(s=>(state.category==='全部主题'||s.cat===state.category)&&(state.tab!=='saved'||state.saved.includes(s.id)));const d=demoStories.find(s=>s.id===state.detail)||demoStories[0];return `${heading('DISCOVER / RESEARCH','选题发现','把已收集的热点和素材变成值得写的文章：看价值、核对来源、选择角度。',`<button class="btn" data-nav="hotspots">${icon('flame')} 查看热点雷达</button>`)}<div class="tabbar">${[['recommended','为我推荐'],['all','全部线索'],['saved','已收藏']].map(([k,n])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${n}</button>`).join('')}</div><div class="filter-row">${['全部主题','AI 产品','独立开发','效率工具'].map(t=>`<button class="chip ${t===state.category?'active':''}" data-category="${t}">${t}</button>`).join('')}<span style="flex:1"></span><span class="micro">示例信源 · 点击卡片了解更多</span></div><div class="discovery-grid"><section>${cards.length?cards.map(s=>`<article class="story-card ${d.id===s.id?'selected':''}"><div class="row space"><span class="tag info">${s.cat}</span><span class="micro">${s.time}</span></div><div class="story-title">${s.title}</div><p class="story-desc">${s.desc}</p><div class="story-bottom"><span class="source-line">${s.source}</span><div class="row"><button class="btn tiny" data-save="${s.id}">${icon('bookmark',13)} ${state.saved.includes(s.id)?'已收藏':'收藏'}</button><button class="btn tiny primary" data-detail="${s.id}">查看判断 ${icon('arrow',13)}</button></div></div></article>`).join(''):'<div class="empty">这里暂时没有线索。可以返回「为我推荐」。</div>'}</section><aside class="surface surface-pad detail-panel"><div class="eyebrow">EDITORIAL BRIEF · 选题判断</div><h3>${d.title}</h3><span class="tag info">推荐视角</span><div class="detail-quote">${d.angle}</div><h4>为什么值得写</h4><p>${d.desc}</p><h4>需要先核实什么</h4><p>${d.risk}</p><h4>来源策略</h4><p>${d.evidence}</p><div class="row"><span class="tag">${d.cat}</span><span class="micro">${d.source}</span></div><button class="btn primary" data-idea="${d.id}">围绕这个选题开始写作 ${icon('arrow',16)}</button><p style="text-align:center;fon function editableHTML(){const key=state.articleId+':'+state.channel;if(state.draftHtml[key])return state.draftHtml[key];const a=state.articles.find(x=>x.id===state.articleId)||state.articles[0];let title=a.title;if(state.channel==='wechat')return `<h1>${title}</h1><p>我们很容易被一个 AI 演示打动：打开软件、找到按钮、自动完成操作，看起来像是一位真正的数字同事。</p><p>但对于需要长时间使用的人来说，比「能不能做」更重要的，也许是「能不能持续、可靠地做」。</p><h2>一、从单次演示到日常使用</h2><p>我们先区分两个问题：模型有能力操作电脑，与一项任务能在不同环境下被稳定完成，并不是同一回事。</p><blockquote>写给读者的真正价值，不是展示更多能力，而是解释哪些场景已经足够可靠，哪些仍需谨慎。</blockquote><p>接下来需要用真实案例与公开来源核实具体判断。</p>`;if(state.channel==='zhihu')return `<h1>${title}</h1><p><b>先说结论：</b>桌面 AI Agent 真正需要竞争的，不是每一分钟替用户点击多少次，而是完成任务时的确定性与可控性。</p><h2>它与传统自动化究竟有什么区别？</h2><p>从自然语言理解、跨应用操作，到异常恢复，这些能力确实可以形成新的体验；但不同产品的边界并不相同。</p><h2>普通用户最应该关注什么？</h2><p>我会优先问三个问题：失败时能否恢复？关键权限能否确认？完成后是否能审计结果？</p><p>具体产品能力仍需要逐项验证，不能仅根据演示下结论。</p>`;return `<h1>${title}</h1><p>桌面 AI Agent 似乎离我们越来越近。它可以理解自然语言、调用工具，甚至直接操作桌面应用。不过，一个令人惊艳的演示，并不自动意味着它适合日常工作。</p><p>这篇文章想讨论的是：<strong>当我们真正把 AI 交给工作流程时，应该用什么标准判断它是否可靠？</strong></p><h2>01 · 为什么「完成任务」不等于「可靠可用」</h2><p>一段顺利的操作视频，可以证明某项能力在某种条件下能够实现；但真实场景还需要处理权限、错误恢复、上下文缺失和不可预测的页面变化。</p><blockquote>待核实：不同类型桌面 Agent 在真实任务中的成功率与失败恢复方式。</blockquote><h2>02 · 用户真正需要的是可控性</h2><p>当助手能够执行越来越多的动作，用户需要的就不只是「聪明」，还包括了解它为什么这样做、失败后如何恢复，以及哪些关键操作必须人工确认。</p><h2>03 · 把 Agent 当作可靠的协作者</h2><p>下一步，我们需要结合真实产品和可重复的测试场景，给出更具体的判断。</p>`}
function visualBoard(){return `<div class="visual-board"><div class="row space"><div><div class="eyebrow">VISUAL STUDIO</div><h3 style="font-size:23px;margin:4px 0 7px">让图片成为内容的一部分</h3><p class="muted" style="font-size:12px;line-height:1.8">先规划，再生成；每张图独立审阅，不自动覆盖主稿。</p></div><span class="tag info">AI 配图方案 · 交互演示</span></div><div class="visual-feature"><div class="visual-preview ${state.visualTheme?'alt':''}"><div class="visual-circle"></div><div class="visual-square"></div><div class="visual-headline">比替你点击更重要的，<br/>是值得信任的执行。</div><div class="visual-sub">DESKTOP AGENT · EDITORIAL SERIES</div></div><div class="visual-meta"><span class="tag">封面建议 01</span><h4>抽象几何 · 观点型封面</h4><p>以结构化的几何秩序表达「可靠、可控」的主题，避免生成虚假的产品截图或人物。</p><div class="row" style="flex-wrap:wrap;margin-top:16px"><button class="btn tiny" data-action="visual-refresh">${icon('spark',13)} 换一种风格</button><button class="btn tiny primary" data-action="visual-adopt">${state.visualAdopted?'✓ 已选中封面':'选中这张封面'}</button></div></div></div><div class="section-top" style="margin:28px 0 13px"><h3>文章内配图计划</h3><span class="micro">根据段落需要设计，而不是固定每段一张</span></div><div class="visual-plan"><div class="plan-visual"><span>01</span><div></div><div></div><div></div></div><div><b>流程示意图 · 从指令到可验证结果</b><p>建议放在第 2 节，用简洁流程表达权限确认、执行、异常恢复和结果校验。这里仅展示方案，不生成真实图片。</p><button class="btn tiny" data-action="visual-plan">查看方案并调整 →</button></div></div><div class="setting-note" style="margin-top:18px">正式版：接入 ChatGPT Image / Gemini / Qwen 等适配器；生成前展示费用、尺寸和图片数量；产物进入素材库，可单图重试和人工确认。</div></div>`}

Board():`<article class="editor-paper" id="editorDoc"><div class="row space"><span class="paper-label">${state.channel==='master'?'MASTER DRAFT':state.channel==='wechat'?'WECHAT DRAFT':'ZHIHU DRAFT'}</span><span class="micro">v3 · 编辑即存（演示）</span></div><div class="editable" contenteditable="true" spellcheck="false" aria-label="文章正文，可直接编辑" id="editableArticle">${editableHTML()}</div></article>`}</section><aside class="editor-assistant"><div class="agent-header"><div class="agent-symbol">${icon('spark',18)}</div><div><b>创作助手</b><small>懂你的风格，也懂当前文章</small></div></div><div class="agent-suggest"><span class="tag warning">下一步建议</span><p><b>先补齐关键证据，再进入配图。</b><br/>这篇文章有 2 处可能需要验证的判断。</p><button class="btn tiny primary" data-agent="核对事实">帮我检查 ${icon('arrow',13)}</button></div><div class="section-top" style="margin:23px 0 10px"><h3 style="font-size:12px">让 AI 帮你做</h3></div>${[['search','查找支持材料'],['edit','优化文章开头'],['shield','检查事实与表达'],['image','准备封面与配图']].map(([i,t])=>`<button class="agent-action" data-agent="${t}">${icon(i)}<span>${t}</span><span style="margin-left:auto;color:#bdc1ce">${icon('chevron',14)}</span></button>`).join('')}${state.agentResult?`<div class="agent-result"><b>${state.agentAction}</b><p>${state.agentResult}</p><button class="btn tiny" data-action="apply-agent">${icon('check',12)} 采纳下一步建议</button></div>`:''}<div class="prompt-box"><textarea id="agentPrompt" placeholder="也可以直接说：让开头更有吸引力，保留事实边界……"></textarea><button class="btn tiny primary" data-action="send-prompt">发送 ${icon('arrow',13)}</button></div><p class="micro" style="line-height:1.8;margin-top:17px">演示模式：展示交互反馈，不调用模型或产生费用。</p></aside></div></div>`}
function publishView(){const which=state.publishTab, checked=state.checks[which], name=which==='wechat'?'微信公众号':'知乎', pending=checked.filter(v=>!v).length;return `${heading('PUBLISH / DELIVERY','发布之前，再确认一次','一个作品，多份平台稿；事实、图片和排版检查按平台独立记录。',`<button class="btn" data-nav="works">${icon('file')} 返回作品</button>`)}<div class="publish-grid"><div><div class="surface channel-card"><div class="row space"><div class="row"><div class="channel-logo">微</div><div><h3>微信公众号</h3><p>《一个人做产品时，最容易忽略的三种成本》</p></div></div><span class="tag ${state.checks.wechat.every(Boolean)?'success':'warning'}">${state.checks.wechat.every(Boolean)?'检查完成':'待确认'}</span></div><div class="checklist">${['事实、数据与引用来源','隐私信息与敏感内容','图片及文字使用权','移动端排版与裁切预览'].map((t,i)=>`<label class="check-item"><input type="checkbox" data-check="wechat:${i}" ${state.checks.wechat[i]?'checked':''}/><span>${t}</span><span style="margin-left:auto;color:#9ea5b1;font-size:10px">${state.checks.wechat[i]?'已检查':'待检查'}</span></label>`).join('')}</div><div class="row space" style="margin-top:18px"><button class="btn tiny" data-open="a3">编辑公众号稿</button><button class="btn primary" data-publish="wechat">${state.checks.wechat.every(Boolean)?'准备微信草稿交付':'继续完成发布检查'} ${icon('arrow',14)}</button></div></div><div class="surface channel-card"><div class="row space"><div class="row"><div class="channel-logo zhihu">知</div><div><h3>知乎</h3><p>独立标题、开头和段落结构</p></div></div><span class="tag warning">待确认</span></div><div class="checklist">${['关键观点与资料出处','平台版本独立审阅','图片使用权与外链','平台真实展示预览'].map((t,i)=>`<label class="check-item"><input type="checkbox" data-check="zhihu:${i}" ${state.checks.zhihu[i]?'checked':''}/><span>${t}</span><span style="margin-left:auto;color:#9ea5b1;font-size:10px">${state.checks.zhihu[i]?'已检查':'待检查'}</span></label>`).join('')}</div><div class="row space" style="margin-top:18px"><button class="btn tiny" data-open="a3">编辑知乎稿</button><button class="btn primary" data-publish="zhihu">${state.checks.zhihu.every(Boolean)?'准备知乎交付':'继续完成发布检查'} ${ic function reviewView(){return `${heading('INSIGHTS / LEARNING','发布后，让经验回到下一篇','查看真实表现、记录写作判断，并让 AI 学习你明确认可的修改。',`<button class="btn" data-action="insights">${icon('link')} 连接数据源</button>`)}<div class="setting-note" style="margin:0 0 19px">以下是<strong>高保真原型演示数据</strong>，并非连接到你真实的公众号或知乎账号。真实产品必须标注数据来源、同步时间和缺失项。</div><div class="insight-kpis">${[['示例阅读量','2,480','过去 7 天 · 模拟'],['示例互动数','126','点赞、评论与收藏 · 模拟'],['已发布作品','1','作品库中的示例状态']].map(([n,v,sub])=>`<div class="surface surface-pad"><span class="micro">${n}</span><strong>${v}</strong><small>${sub}</small></div>`).join('')}</div><div class="home-cols"><section class="surface surface-pad"><div class="section-top"><div><h3>内容表现</h3><p>不只看浏览量，也看哪些内容真正帮助了读者</p></div><span class="tag info">示例趋势 · 7 天</span></div><div class="trend-bars">${[36,52,42,71,57,86,68].map((v,i)=>`<div><span style="height:${v}%"></span><small>${['一','二','三','四','五','六','日'][i]}</small></div>`).join('')}</div><table class="works-table" style="margin-top:18px"><tbody><tr><td><button class="table-title" data-open="a4">把 AI 变成真正可靠的工作伙伴</button></td><td><span class="tag success">已发布</span></td><td style="text-align:right" class="micro">数据示例</td></tr></tbody></table></section><section class="surface surface-pad"><div class="section-top"><div><h3>你的写作风格，正在积累</h3><p>学习必须由你确认，不能让一次改稿改变长期偏好</p></div></div><div class="agent-suggest"><span class="tag info">编辑习惯建议</span><h4 style="font-size:14px;line-height:1.6;margin:13px 0">减少抽象开场，更快进入具体问题</h4><p>在多篇文章中观察到，你倾向于保留有证据的判断、删去泛泛的铺垫句。建议记录为写作偏好。</p><div class="row"><button class="btn tiny primary" data-action="learn-style">${state.styleLearned?'已采纳':'确认学习'}</button><button class="btn tiny" data-action="ignore-style">暂不学习</button></div></div><div class="source-item"><span>事实边界优先于表达强度</span><span class="tag success">已知偏好</span></div><div class="source-item"><span>技术文章尽量包含真实使用场景</span><span class="tag success">已知偏好</span></div><div class="source-item"><span>新增习惯需要你确认</span><span class="tag">待判断</span></div></section></div>`}
function calendarView(){let days=[19,20,21,22,23,24,25];return `${heading('CONTENT CALENDAR','把创作节奏，安排得从容一点','只展示已经安排的作品；AI 可以建议节奏，但不会擅自发布。',`<button class="btn primary" data-action="schedule">${icon('plus')} 安排内容</button>`)}<section class="surface surface-pad"><div class="section-top"><div><h3>2026 年 10 月 · 本周</h3><p>10 月 19 日 — 10 月 25 日</p></div><span class="tag info">周视图</span></div><div class="calendar-strip">${days.map((d,i)=>`<button class="day ${state.calendarDay===d?'selected':''}" data-day="${d}"><small>${['周一','周二','周三','周四','周五','周六','周日'][i]}</small><b>${d}</b>${d===21?'<span class="event">公众号<br/>待发布</span>':d===24?'<span class="event">独立开发<br/>计划稿</span>':''}</button>`).join('')}</div><div class="section-top" style="margin:27px 0 0"><div><h3>10 月 ${state.calendarDay} 日的安排</h3><p>${state.calendarDay===21?'待发布稿必须人工确认后交付':state.calendarDay===24?'建议跟进本周的独立开发话题':'暂无已排定作品'}</p></div><button class="btn tiny" data-nav="works">去作品库 ${icon('arrow',12)}</button></div></section><section class="surface surface-pad" style="margin-top:21px"><div class="section-top"><h3>长期内容系列</h3><span class="tag">计划中</span></div><div class="row space"><div><b style="font-size:14px">独立开发者的真实工作流</b><p class="muted" style="font-size:12px;line-height:1.7">每次只准备下一篇，根据本周的时间与资料成熟度灵活调整。</p></div><button class="btn tiny" data-action="schedule">调整安排</button></div></section>`}
function libraryView(){const things=[['book','研究资料','桌面 Agent 的设计边界','已关联 1 篇作品','one'],['link','公开线索','独立开发者的产品定价讨论','等待核实','two'],['image','视觉资产','文章封面 · 蓝紫色几何插画','可用于公众号','three'],['file','作品参考','之前写过的 AI 效率工具分析','可学习文风','one'],['link','公开线索','信息管理工具的任务闭环','等待转为选题','two'],['image','视觉资产','个人品牌视觉参考','用作统一视觉语言','three']];return `${heading('CONTENT LIBRARY','素材不是仓库，是作品的上下文','所有引用、图片和历史文章都能从作品中直接找到，不必来回切换。',`<button class="btn" data-action="upload">${icon('upload')} 导入素材</button>`)}<div class="filter-row"><div class="searchbox">${icon('search')}<input placeholder="搜索素材或作品…" value="${state.search}" id="librarySearch"/></div>${[['all','全部'],['book','文章'],['link','链接'],['image','图片']].map(([k,n])=>`<button class="chip ${state.libraryFilter===k?'active':''}" data-library-filter="${k}">${n}</button>`).join('')}</div><div class="asset-grid">${things.filter(([k,typ,title])=>(state.libraryFilter==='all'||(state.libraryFilter==='book'?k==='book'||k==='file':k===state.libraryFilter))&&title.includes(state.search)).map(([k,typ,title,sub,v])=>`<button class="asset-card" data-action="asset"><div class="asset-visual ${v==='two'?'two':v==='three'?'three':''}">${icon(k,28)}</div><div class="row space" style="margin-top:14px"><span class="tag">${typ}</span><span class="micro">查看 ${icon('arrow',12)}</span></div><h3>${title}</h3><p>${sub}</p></button>`).join('')}</div>`}
function settingsView(){let o=state.settings, data={profile:['创作画像','帮助 AI 理解你的读者和表达方式','创作方向','AI 产品、独立开发和效率工具','目标读者','正在探索新技术、希望提升效率的创作者','写作偏好','清晰、克制、少套话、有事实依据'],models:['模型与费用','提供商与模型在这里维护，不干扰日常写作','当前写作模型','未连接（设计演示）','备用写作模型','按需配置','单次费用提醒','调用前展示范围与成本'],accounts:['发布账号','公众号、知乎等发布渠道集中管理','微信公众号','待连接','知乎账号','待连接','默认发布策略','人工确认，不自动发布'],sources:['信源与研究','管理可信信息源与定时抓取','默认信源','AIHOT / Hacker News / OpenAI / DeepMind','推荐方式','优先证据充分的线索','来源边界','公开内容作为线索，重要事实必须核查']}[o];return `${heading('PERSONALIZE','让工作台逐渐了解你的风格','基础设置一次完成，高级选项需要时再打开。')}<div class="settings-grid"><nav class="settings-menu">${[['profile','创作画像'],['models','模型与费用'],['accounts','发布账号'],['sources','信源与研究']].map(([k,n])=>`<button class="${o===k?'active':''}" data-setting="${k}">${n}</button>`).join('')}</nav><section class="surface surface-pad" style="max-width:730px"><div class="section-top"><div><h3>${data[0]}</h3><p>${data[1]}</p></div></div><div class="setting-note">这是独立的 UI/UX 演示，下面展示信息布局，不会修改生产环境的设置或密钥。</div>${[[data[2],data[3]],[data[4],data[5]],[data[6],data[7]]].map(([label,value])=>`<label class="setting-field">${label}<input value="${value}" /></label>`).join('')}<button class="btn primary" data-action="settings-save">${icon('check')} 保存演示设置</button></section></div>`}
function modal(){if(!state.modal)return '';let content=state.modal==='new'?`<h3>从一个想法开始</h3><p>只需要写下标题或一个问题。选题、证据与大纲可以在创作中逐步完善。</p><input id="newArticle" autofocus placeholder="例如：我想讨论 AI 工具真正解决了什么问题" maxlength="100"/><div class="row space"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="create-article">创建作品 ${icon('arrow',14)}</button></div>`:state.modal==='schedule'?`<h3>安排下一篇</h3><p>作品会进入内容日历，不会自动生成、计费或发布。</p><input id="scheduleTitle" placeholder="这次打算写什么？"/><div class="row space"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="finish-schedule">保存计划</button></div>`:`<h3>导入素材</h3><p>可导入链接、文本、图片或已有文章。这里是演示，暂不上传真实文件。</p><input placeholder="素材标题或网址…" id="assetInput"/><div class="row space"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="finish-upload">保存素材</button></div>`;return `<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${state.modal}">${content}</div></div>`}

const designState={calendarMode:'week',insightRange:'7 天',styleChoice:0,workMode:'card',editorFocus:'source',assetCollection:'全部素材'};
const _v2base={home:homeView,hotspots:hotspotsView,discover:discoverView,works:worksView,editor:editorView,visual:visualBoard,publish:publishView,review:reviewView,calendar:calendarView,library:libraryView,settings:settingsView};
const v2Guide=(current)=>`<div class="v2-step-line"><span class="v2-hint">内容生产主线</span>${[['hotspots','01 热点'],['discover','02 选题'],['editor','03 创作'],['publish','04 交付'],['review','05 复盘']].map(([v,t],i)=>`${i?'<span class="arrow">→</span>':''}<button class="btn tiny ${current===v?'primary':'ghost'}" data-nav="${v}" style="border:0;min-height:26px;padding:5px 8px;font-size:10px">${t}</button>`).join('')}</div>`;
homeView=function(){let h=_v2base.home();const band=`<div class="v2-overview-band"><article class="v2-insight"><span class="v2-label">当前最重要</span><div class="metric">01 <span style="font-size:11px;color:#7885a1;font-weight:550">篇</span></div><p>先完成一篇，再开始下一篇</p></article><article class="v2-insight"><span class="v2-label">等待你的决策</span><div class="metric">02 <span style="font-size:11px;color:#8c95a3;font-weight:550">项</span></div><p>事实核查 · 发布确认</p></article><article class="v2-insight"><span class="v2-label">值得判断的线索</span><div class="metric">03 <span style="font-size:11px;color:#8c95a3;font-weight:550">条</span></div><p>来源已记录，尚未核验</p></article></div>`;return h.replace('<div class="home-cols">',band+'<div class="home-cols">')+`<div class="v2-completion"><div><strong>把下一步留给真正的创作</strong><p>模型、素材和发布账号只有使用时才出现；遇到中断，仍能继续编辑文章。</p></div><button class="btn" data-nav="hotspots">前往独立热点雷达 ${icon('arrow',14)}</button></div>`};
hotspotsView=function(){let h=_v2base.hotspots();const s=`<div class="v2-monitor"><article><i>${icon('clock',15)}</i><div><b>来源更新时间</b><p>本页为示例数据。真实接入后逐个信源显示最近同步、失败与重试。</p></div></article><article><i>${icon('filter',15)}</i><div><b>跨来源去重</b><p>同一事件聚合多个出处，保留原文链接；不以重复转载次数冒充热度。</p></div></article><article><i>${icon('shield',15)}</i><div><b>风险提示</b><p>“上升趋势”与“事实可信”分开判断，未经证实的热点不自动用于写作。</p></div></article></div>`;return h.replace('<div class="hot-flow">',s+'<div class="hot-flow">')+`<div class="v2-completion"><div><strong>热点页负责发现，选题页负责判断</strong><p>关注话题不会自动发布，也不会把整个信源直接注入 AI 上下文。</p></div><button class="btn" data-nav="discover">进入选题研究 ${icon('arrow',14)}</button></div>`};
discoverView=function(){const h=_v2base.discover();return v2Guide('discover')+`<div class="v2-banner"><div><span class="v2-pill">从线索到选题</span><h3>现在最需要决定：值不值得写？</h3><p>把内容热度、读者问题和可核实的证据分开看。右侧简报不是表格任务，而是准备写作时的决策依据。</p></div><button class="btn" data-nav="hotspots">查看全部热点 ${icon('arrow',14)}</button></div>`+h+`<div class="v2-evidence-grid"><article><span class="v2-n">01 / NEED</span><h4>真实读者问题</h4><p>写之前问：这篇文章具体帮谁理解、判断或解决什么？不要为了追热点硬写。</p></article><article><span class="v2-n">02 / EVIDENCE</span><h4>证据与来源账本</h4><p>数据、引述、产品能力必须能追溯原始来源；推断和个人观点明确分层。</p></article><article><span class="v2-n">03 / GO / NO GO</span><h4>动笔门槛</h4><p>角度成立且证据可补，进入创作。信息不充分时收藏观察，不自动制造结论。</p></article></div>`};
worksView=function(){const p=`<div class="v2-pipeline">${[['全部',state.articles.length,'所有作品'],['草稿中',state.articles.filter(a=>a.stage==='草稿中').length,'整理思路'],['审稿中',state.articles.filter(a=>a.stage==='审稿中').length,'验证事实'],['待发布',state.articles.filter(a=>a.stage==='待发布').length,'等待确认'],['已发布',state.articles.filter(a=>a.stage==='已发布').length,'观察表现']].map(([v,n,s])=>`<button data-work-filter="${v}"><small>${v}</small><strong>${n} 篇</strong><span>${s} ${state.workFilter===v?'✓':''}</span></button>`).join('')}</div>`;const h=_v2base.works();return h.replace('<div class="tabbar">',p+'<div class="tabbar">')+`<div class="v2-completion"><div><strong>所有版本都属于同一篇作品</strong><p>主稿、公众号稿、知乎稿、历史修订与配图只管理一次，不再跨多个业务页面反复建档。</p></div><button class="btn" data-nav="calendar">查看内容排期 ${icon('arrow',14)}</button></div>`};
visualBoard=function(){return _v2base.visual()+`<section class="surface surface-pad" style="margin-top:20px;border-color:#e7eaf2"><div class="section-top"><div><h3>视觉风格备选</h3><p>封面、正文插图与主题排版可分开确认</p></div><span class="tag info">选择只改变本地演示</span></div><div class="v2-style-options">${[['克制科技','适合产品研究、AI 深度分析'],['杂志叙事','适合人物故事、观点评论'],['自然编辑','适合公众号长期栏目']].map(([n,d],i)=>`<button data-v2-action="style" data-value="${i}" class="${designState.styleChoice===i?'selected':''}"><div class="v2-theme-art"></div><strong>${n}${designState.styleChoice===i?' · 当前':''}</strong><p>${d}</p></button>`).join('')}</div><div class="setting-note" style="margin-top:18px">配图验收：视觉与正文是否一致、是否存在虚假界面截图、版权来源是否明确、微信公众号裁切是否正常。原图、候选图和最终采用图必须分别保存。</div></section>`};
editorView=function(){const h=_v2base.editor();const ribbon=`<div class="v2-editor-ribbon"><div class="row"><span class="v2-pill warn">资料待核实</span><span><strong>2 处</strong> 事实判断待补原始出处</span><span class="v2-pill">主稿 / 平台稿独立</span></div><span>AI 建议先进入待采纳区，不直接写入文章</span></div>`;const scope=`<div class="v2-assistant-scope"><strong>${icon('shield',13)} 本次 Agent 的工作范围</strong>围绕当前文章、选中的参考资料与写作风格工作。执行前应展示将发送的材料、使用模型及费用；失败不覆盖正文。</div>`;return h.replace('<div class="steps">',ribbon+'<div class="steps">').replace('<div class="agent-suggest">',scope+'<div class="agent-suggest">')};
publishView=function(){const h=_v2base.publish();const top=`<div class="v2-platform-state"><span class="v2-pill warn">有检查项未完成</span><div><strong>状态必须区分：可交付 ≠ 已发布</strong><small>微信草稿箱推送、知乎手动交付、真实发布确认是不同事件，必须保留记录。</small></div><button class="btn tiny" data-nav="works">查看关联作品 ${icon('arrow',13)}</button></div>`;const log=`<div class="v2-delivery-log"><section class="surface surface-pad"><div class="section-top"><h3>本篇交付时间线</h3><span class="tag">演示状态</span></div><div class="v2-log-row"><span class="v2-log-dot"></span><div><strong>已准备主稿与平台版本</strong><p>平台版本使用独立正文修订，原始主稿不会被自动改写。</p></div></div><div class="v2-log-row"><span class="v2-log-dot pending"></span><div><strong>等待完成发布前核查</strong><p>证据、隐私、权利与最终平台展示需要逐项确认。</p></div></div><div class="v2-log-row"><span class="v2-log-dot pending"></span><div><strong>真实发布状态尚未确认</strong><p>演示稿没有生成草稿 ID、线上链接或任何实际发布凭据。</p></div></div></section><section class="surface surface-pad"><div class="section-top"><h3>交付原则</h3></div><div class="v2-evidence-grid" style="display:block;margin:0"><article style="margin-bottom:10px"><h4>失败可恢复</h4><p>网络中断需要保留上一次发送结果与平台返回 ID，不能默认重试导致重复发布。</p></article><article><h4>发布前人工确认</h4><p>渠道分别预览，正式发布由创作者决定；导出和草稿推送不是发布成功。</p></article></div></section></div>`;return h.replace('<div class="publish-grid">',top+'<div class="publish-grid">')+log};
calendarView=function(){let h=_v2base.calendar();const toolbar=`<div class="v2-calendar-toolbar"><div class="v2-insight-bar"><span>2026 年 10 月</span><span class="v2-pill">演示排期</span><span>计划属于作品，Agent 不会直接发布</span></div><div class="v2-segments">${[['week','周视图'],['month','月视图']].map(([v,n])=>`<button data-v2-action="calendar-mode" data-value="${v}" class="${designState.calendarMode===v?'active':''}">${n}</button>`).join('')}</div></div>`;const month=`<section class="surface surface-pad" style="margin:0 0 18px"><div class="section-top"><div><h3>2026 年 10 月 · 全月计划</h3><p>按日期查看计划；变更不会自动发布</p></div><span class="tag">月视图</span></div><div class="v2-month">${['周一','周二','周三','周四','周五','周六','周日'].map(d=>`<div>${d}</div>`).join('')}${Array.from({length:35},(_,i)=>{const d=i-2;const ev=d===21?'微信公众号 · 待核查':d===24?'独立开发 · 计划稿':d===19?'线索研究':d===15?'文章复盘':'';return `<button ${d>=1&&d<=31?`data-day="${d}"`:''} class="${d<1||d>31?'off':''} ${state.calendarDay===d?'focused':''}">${d>=1&&d<=31?d:''}${ev?`<em>${ev}</em>`:''}</button>`}).join('')}</div></section>`;if(designState.calendarMode==='month'){const i=h.indexOf('<section class="surface surface-pad">');const j=h.indexOf('</section>',i);if(i>=0&&j>=0)h=h.slice(0,i)+month+h.slice(j+10)}return h.replace('<section class="surface surface-pad">',toolbar+'<section class="surface surface-pad">')+`<div class="v2-completion"><div><strong>日历不应该是隐藏的自动发布器</strong><p>每个日期展示已计划的作品、人工待办和执行证据；安排只是计划，不替你发送内容。</p></div><button class="btn" data-nav="publish">查看待交付内容 ${icon('arrow',14)}</button></div>`};
reviewView=function(){let h=_v2base.review();const tools=`<div class="v2-insight-bar"><div class="v2-segments">${['7 天','30 天','90 天'].map(x=>`<button data-v2-action="review-range" data-value="${x}" class="${designState.insightRange===x?'active':''}">${x}</button>`).join('')}</div><span>选中的范围：${designState.insightRange} · 图表数据均为示例</span><span class="v2-pill warn">未连接真实账号</span></div>`;let blocks=`<div class="v2-learning"><article><span class="v2-pill">选题判断</span><strong style="display:block;margin-top:12px">哪些问题真正触发阅读？</strong><p>观察读者的实际问题和平台反馈，避免将一次高流量直接解释为选题有效。</p></article><article><span class="v2-pill">文章质量</span><strong style="display:block;margin-top:12px">证据是否带来信任？</strong><p>记录来源数量、纠错成本与发布后需要补充的信息。</p></article><article><span class="v2-pill">风格学习</span><strong style="display:block;margin-top:12px">哪些人工修改值得沉淀？</strong><p>只学习明确确认过的编辑习惯，所有规则保留出处与撤销能力。</p></article></div>`;return h.replace('<div class="setting-note"',tools+'<div class="setting-note"')+blocks};
libraryView=function(){let h=_v2base.library();const x=`<div class="v2-assets-head"><div><strong style="font-size:13px">我的内容资料夹</strong><p>按来源与用途组织，而不是把抓取的全部数据直接加入模型上下文。</p></div><span class="v2-pill">点击分类切换下方素材</span></div><div class="v2-collections">${[['全部素材','文章、链接与图片'],['参考线索','公开来源 · 待核实'],['视觉素材','封面、内文插图与品牌']].map(([v,sub],i)=>`<button data-v2-action="asset-group" data-value="${v}"><span class="v2-pill ${designState.assetCollection===v?'good':''}">${i===0?'资料总览':i===1?'研究资料':'创作视觉'}</span><strong>${v}</strong><p>${sub}</p></button>`).join('')}</div>`;return h.replace('<div class="filter-row">',x+'<div class="filter-row">').replace('搜索素材或作品…',designState.assetCollection==='全部素材'?'搜索素材或作品…':`在「${designState.assetCollection}」中搜索…`)+`<div class="v2-completion"><div><strong>每条素材保留上下文</strong><p>正式版应标注来源、抓取时间、授权状态、关联文章和移除影响；引用前核实，发布后保留证据。</p></div><button class="btn" data-nav="discover">用素材发现选题 ${icon('arrow',14)}</button></div>`};
settingsView=function(){let h=_v2base.settings();const s=`<div class="v2-settings-head"><span class="v2-pill good">基础编辑不依赖 AI</span><span>即使没有配置模型和发布账号，也可以新建、编辑、保存及导出文章。</span></div>`;const foot=`<div class="v2-completion"><div><strong>配置项只在真正需要时出现</strong><p>模型连接、私有材料发送和付费调用在执行前展示；真实密钥应仅保存在服务端，不出现在日志与原型中。</p></div><button class="btn" data-nav="editor">回到写作 ${icon('arrow',14)}</button></div>`;return h.replace('<div class="settings-grid">',s+'<div class="settings-grid">')+foot};
// Interaction controls added for refinements; no server side effects.
document.addEventListener('click',e=>{const b=e.target.closest('[data-v2-action]');if(!b)return;const action=b.dataset.v2Action,value=b.dataset.value;if(action==='calendar-mode')designState.calendarMode=value;if(action==='review-range')designState.insightRange=value;if(action==='style'){designState.styleChoice=Number(value);state.visualTheme=designState.styleChoice===1?1:0;}if(action==='asset-group'){designState.assetCollection=value;state.libraryFilter=value==='视觉素材'?'image':value==='参考线索'?'link':'all';state.search='';}render()});

let toastTimer;
function toast(v){state.notice=v;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.notice='';render()},2700)}
function render(){const views={home:homeView,hotspots:hotspotsView,discover:discoverView,works:worksView,editor:editorView,publish:publishView,calendar:calendarView,review:reviewView,library:libraryView,settings:settingsView};document.getElementById('app').innerHTML=nav()+`<div class="shell">${topbar()}<main class="main">${views[state.view]()}</main></div>`+mobile()+drawer()+modal()+(state.notice?`<div class="toast" role="status">${state.notice}</div>`:'');}
function go(view){state.showMobileMore=false;state.view=view;state.modal='';state.showSources=false;state.hotDetailOpen=false;state.agentResult='';render();scrollTo(0,0)}
function openArticle(id){state.articleId=id;state.editorMode='write';state.editorStep=id==='a3'?4:2;state.channel='master';go('editor')}
function startFrom(id){const s=demoStories.find(x=>x.id===id);if(!s)return;const a={id:'a'+(Date.now()),title:s.title,stage:'草稿中',subtitle:'由选题线索创建 · 待整理证据',updated:'刚刚',channels:['公众号','知乎']};state.articles.unshift(a);openArticle(a.id);toast('已创建作品，可以直接编辑；示例正文不会从网络生成。')}
function agentAction(label){state.agentAction=label;state.agentResult=label.includes('封面')?'建议使用抽象几何视觉，避免把未经证实的产品界面作为配图。确认预算和尺寸后再生成。':label.includes('事实')||label.includes('证据')||label.includes('材料')?'建议补充：① 桌面 Agent 的公开技术文档；② 失败恢复或权限确认的真实实例。现阶段不能断言不同产品的成功率。':'建议先用一个真实的用户问题开头，删除过于宽泛的判断，并保留事实与观点之间的界限。';render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-hot-tab],[data-hot-platform],[data-hot-select],[data-hot-close],[data-hot-follow],[data-hot-create],[data-nav],[data-open],[data-action],[data-detail],[data-tab],[data-category],[data-save],[data-idea],[data-work-filter],[data-channel],[data-agent],[data-publish-tab],[data-publish],[data-day],[data-library-filter],[data-setting],[data-source-switch],[data-editor-mode]');if(!b)return;const d=b.dataset;
if(d.hotTab){state.hotTab=d.hotTab;return render()}
if(d.hotPlatform){state.hotPlatform=d.hotPlatform;return render()}
if(d.hotSelect){state.hotSelected=d.hotSelect;state.hotDetailOpen=innerWidth<=740;return render()}if(d.hotClose){state.hotDetailOpen=false;return render()}
if(d.hotFollow){const f=d.hotFollow;state.hotFollowed=state.hotFollowed.includes(f)?state.hotFollowed.filter(v=>v!==f):[...state.hotFollowed,f];return toast(state.hotFollowed.includes(f)?'已在原型会话中关注这个话题':'已取消关注')}
if(d.hotCreate){const h=demoHotspots.find(x=>x.id===d.hotCreate);if(!h)return;const existing=demoStories.find(x=>x.hotSource===h.id);if(existing){state.detail=existing.id;go('discover');return toast('这个线索已在选题库，已打开选题判断')}
const story={id:Math.max(...demoStories.map(x=>x.id))+1,hotSource:h.id,cat:['AI 产品','独立开发','效率工具'].includes(h.category)?h.category:'AI 产品',title:h.title,desc:h.summary,source:h.source,time:'刚刚添加',angle:h.angle,risk:h.risk,evidence:'由热点页面转入，真实数据接入后应关联原始链接和抓取时间。'};
demoStories.unshift(story);state.detail=story.id;state.tab='all';state.category='全部主题';go('discover');return toast('热点已成为选题候选，可继续判断后开始写作')}
if(d.nav)return go(d.nav);if(d.open)return openArticle(d.open);if(d.detail){state.detail=Number(d.detail);return go('discover')}if(d.tab){state.tab=d.tab;return render()}if(d.category){state.category=d.category;return render()}if(d.save){const x=Number(d.save);state.saved=state.saved.includes(x)?state.saved.filter(a=>a!==x):[...state.saved,x];return toast(state.saved.includes(x)?'已收藏这个选题':'已取消收藏')}if(d.idea)return startFrom(Number(d.idea));if(d['workFilter']){state.workFilter=d['workFilter'];return render()}if(d.channel){state.channel=d.channel;state.agentResult='';return render()}if(d.agent){if(d.agent.includes('封面'))state.editorMode='visual';return agentAction(d.agent)}if(d['editorMode']){state.editorMode=d['editorMode'];return render()}if(d['publishTab']){state.publishTab=d['publishTab'];return render()}if(d.publish){const x=d.publish,remain=state.checks[x].filter(v=>!v).length;return toast(remain?`还有 ${remain} 项发布前检查未完成；请在当前页面逐项确认。`:'检查已完成。正式版本将在此提供真实平台交付；原型不执行发布。')}if(d.day){state.calendarDay=Number(d.day);return render()}if(d['libraryFilter']){state.libraryFilter=d['libraryFilter'];state.search='';return render()}if(d.setting){state.settings=d.setting;return render()}if(d['sourceSwitch']){const i=Number(d['sourceSwitch']);state.sourcesEnabled[i]=!state.sourcesEnabled[i];return render()}
if(d.action==='hot-refresh')return toast('这是示例热点，未接入真实数据；上线后将提供同步时间与失败提示');if(d.action==='mobile-more'){state.showMobileMore=!state.showMobileMore;return render()}if(d.action==='new'||d.action==='schedule'||d.action==='upload'){state.modal=d.action==='new'?'new':d.action==='schedule'?'schedule':'upload';return render()}if(d.action==='close-modal'){state.modal='';return render()}if(d.action==='create-article'){let name=document.getElementById('newArticle')?.value.trim();if(!name)return toast('先写下一个标题或想法');const a={id:'a'+Date.now(),title:name,stage:'草稿中',subtitle:'你刚刚创建的作品',updated:'刚刚',channels:['公众号','知乎']};state.articles.unshift(a);return openArticle(a.id)}if(d.action==='sources'){state.showSources=true;return render()}if(d.action==='close-sources'){state.showSources=false;return render()}if(d.action==='preview')return toast('当前编辑器为交互原型。正式版将提供独立的微信/知乎真实排版预览。');if(d.action==='send-prompt'){const txt=document.getElementById('agentPrompt')?.value.trim();return txt?agentAction('自定义请求：'+txt.slice(0,18)):toast('先输入希望 AI 协助完成的事情')}if(d.action==='apply-agent'){state.editorStep=Math.min(4,state.editorStep+1);state.agentResult='';return toast('已记录建议方向。正式版需人工审核后才能修改文章正文。')}if(d.action==='settings-save')return toast('已演示设置保存反馈；未修改真实配置。');if(d.action==='visual-refresh'){state.visualTheme=state.visualTheme?0:1;return render()}if(d.action==='visual-adopt'){state.visualAdopted=!state.visualAdopted;return toast(state.visualAdopted?'已选中演示封面（不执行真实保存或生成）。':'已撤销封面选择')}if(d.action==='visual-plan')return toast('正式版会打开可编辑的图示规划与分镜说明。');if(d.action==='learn-style'){state.styleLearned=true;return toast('已确认示例写作偏好；正式版会记录来源和适用范围。')}if(d.action==='ignore-style')return toast('已忽略本次建议。');if(d.action==='insights')return toast('正式版按平台权限接入表现数据，并标注来源与同步时间。');if(d.action==='asset')return toast('正式版将显示来源、引用关联、可用状态与移除影响。');if(d.action==='finish-schedule'){const x=document.getElementById('scheduleTitle')?.value.trim();state.modal='';return toast(x?'计划已添加（仅原型会话）':'请先填写内容主题')}if(d.action==='finish-upload'){const x=document.getElementById('assetInput')?.value.trim();state.modal='';return toast(x?'已展示导入操作（未真正上传）':'请输入标题或网址')}});
document.addEventListener('change',e=>{const x=e.target.dataset.check;if(x){let [c,i]=x.split(':');state.checks[c][Number(i)]=e.target.checked;render()}});document.addEventListener('input',e=>{if(e.target.id==='hotSearch'){state.hotSearch=e.target.value;const q=state.hotSearch.toLowerCase();document.querySelectorAll('.hot-row').forEach(row=>row.style.display=row.innerText.toLowerCase().includes(q)?'':'none');const badge=document.querySelector('.hot-list-head .tag');if(badge)badge.textContent=[...document.querySelectorAll('.hot-row')].filter(row=>row.style.display!=='none').length+' 条';}if(e.target.id==='editableArticle'){state.draftHtml[state.articleId+':'+state.channel]=e.target.innerHTML;const s=document.getElementById('saveStatus');if(s)s.textContent='内容已修改 · 原型不保存到服务端';}if(e.target.id==='librarySearch'){state.search=e.target.value;let pos=e.target.selectionStart;render();const next=document.getElementById('librarySearch');next?.focus();next?.setSelectionRange(pos,pos)}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.modal='';state.showSources=false;state.hotDetailOpen=false;render()}});render();
