nd" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.grid}</svg>`};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slots=[

{id:'trust',title:'正文配图 02',role:'figure',anchor:'第三节之后 · 信任边界',purpose:'表达人工确认与 Agent 自动执行的边界，避免空泛的装饰性插图。',status:'planned',selected:true,adopted:false,versions:[],chosen:0,brief:'暖白背景的简洁关系图：左侧是 Agent 动作，右侧是用户判断，中间是审核与证据。',why:'解释可信协作需要人类保留决策权',alt:'AI Agent 与人的决策边界',size:'16:9'}

const st={view:'editor',mobileTab:'article',mode:'full',style:'editorial',slot:'cover',modal:'',previewPlatform:'wechat',busy:false,planReady:true,planCount:1,advanced:false,estimate:0.36,showToast:'',reviewOpen:false,quote:'换成更温暖的杂志风，弱化抽象圆环，保留主视觉层级。',newVariantIndex:9,editCount:0,compareSelect:1};

function art(variant=0,aspect='cover'){
const v=Number(variant)||0;const isFlow=v===3||v===4;const isTrust=v>=6; const palette=v===1?['#ede6dd','#3b555c','#ccac8f','#556d78']:v===2?['#f0e8d7','#244e42','#8aab98','#476b60']:v===4?['#e7ecff','#26365f','#97afea','#5575c4']:v===5?['#e7e8f1','#222b50','#a6b8e9','#4959a4']:v===7?['#eff2ea','#254f43','#a1bdac','#467962']:['#303f70','#f1f3fb','#9baee0','#5068a4'];let [bg,fg,soft,mid]=palette;
if(isFlow){return `<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="440" fill="${v===4?'#edf1ff':'#faf9f5'}"/><path d="M0 370h800" stroke="#e1e4eb"/><text x="54" y="76" font-family="sans-serif" font-size="17" fill="#7a8298" letter-spacing="3">HUMAN · AGENT WORKFLOW</text><g fill="none" stroke="#96a9d0" stroke-width="3"><path d="M274 232h60m140 0h60"/><path d="m326 220 13 12-13 12m203-24 13 12-13 12"/></g>${['任务执行','证据核对','失败恢复'].map((q,i)=>`<g transform="translate(${43+i*253},142)"><rect width="214" height="175" rx="15" fill="${i===1?'#e5ebfc':'#fff'}" stroke="#d8deeb"/><rect x="22" y="23" width="40" height="40" rx="12" fill="${['#e7ecff','#dcece7','#f9eae1'][i]}"/><text x="42" y="50" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#5269a6">${i+1}</text><text x="22" y="94" font-family="sans-serif" font-size="26" font-weight="600" fill="#344154">${q}</text><rect x="22" y="114" width="155" height="6" rx="3" fill="#dfe4ed"/><rect x="22" y="135" width="112" height="6" rx="3" fill="#e7eaf0"/></g>`).join('')}<text x="52" y="400" font-size="15" font-family="sans-serif" fill="#a2a8b6">PLAN  —  VERIFY  —  RECOVER</text></svg>`}
if(isTrust){return `<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="440" fill="#f5f3eb"/><circle cx="390" cy="212" r="144" fill="#e6ebdb"/><g><rect x="95" y="130" width="210" height="165" rx="22" fill="#304e43"/><rect x="503" y="130" width="210" height="165" rx="22" fill="#486e66"/><rect x="335" y="170" width="132" height="86" rx="16" fill="#fff" stroke="#c9d7c9"/><path d="M306 213h28m135 0h32" stroke="#9cb7a9" stroke-width="5" stroke-dasharray="7 7"/></g><text x="200" y="208" text-anchor="middle" fill="white" font-family="sans-serif" font-size="25">Agent</text><text x="200" y="242" text-anchor="middle" fill="#c6d9ce" font-family="sans-serif" font-size="17">执行</text><text x="608" y="208" text-anchor="middle" fill="white" font-family="sans-serif" font-size="25">人</text><text x="608" y="242" text-anchor="middle" fill="#daebe0" font-family="sans-serif" font-size="17">决策</text><text x="401" y="206" text-anchor="middle" fill="#445b51" font-family="sans-serif" font-size="21">核验</text><text x="401" y="233" text-anchor="middle" fill="#93a69c" font-family="sans-serif" font-size="13">Evidence</text></svg>`}
return `<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="440" fill="${bg}"/><g opacity=".13" stroke="${fg}" stroke-width="1">${Array.from({length:15},(_,i)=>`<path d="M${i*67} 0v440"/>`).join('')}${Array.from({length:8},(_,i)=>`<path d="M0 ${i*67}h800"/>`).join('')}</g>${v===1?`<path d="M525 -60c190 100 180 284 41 376s-312-10-295-165 109-209 254-211Z" fill="${soft}"/><path d="m262 178 193-120 129 197-193 120z" fill="none" stroke="${mid}" stroke-width="4"/>`:v===2?`<rect x="425" y="-110" width="310" height="420" rx="85" fill="${mid}" transform="rotate(19 580 100)"/><circle cx="545" cy="203" r="135" fill="${soft}"/><path d="m355 247 198-153 124 152-198 153z" fill="none" stroke="${fg}" stroke-width="3"/>`:`<circle cx="622" cy="111" r="190" fill="${soft}" opacity=".78"/><circle cx="620" cy="110" r="190" stroke="${fg}" stroke-width="1.5" fill="none" opacity=".6"/><path d="m405 255 177-219 177 137-177 219z" fill="none" stroke="${fg}" stroke-width="3" opacity=".75"/><path d="M270 350 520 24" fill="none" stroke="${fg}" stroke-width="3" opacity=".6"/>`}<text x="54" y="67" font-family="sans-serif" font-size="16" font-weight="600" fill="${fg}" opacity=".74" letter-spacing="4">EDITORIAL · AI SYSTEMS</text><text x="54" y="310" font-family="sans-serif" font-size="38" fill="${fg}" font-weight="750">比演示更重要的，</text><text x="54" y="361" font-family="sans-serif" font-size="38" fill="${fg}" font-weight="750">是可信赖的执行</text><text x="55" y="406" font-family="sans-serif" font-size="14" fill="${fg}" opacity=".65" letter-spacing="3">DESKTOP AGENT · SERIES 01</text></svg>`}
function svgbox(v,cls='art'){return `<div class="${cls}">${art(v)}</div>`}
function toast(message){const x=document.querySelector('.floater');if(!x){st.showToast=message;render();return}x.innerHTML=escapeHTML(message);x.classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>x.classList.add('hidden'),2900)}
function nav(){return `<aside class="side"><div class="logo"><div class="logo-icon">C</div><div class="logo-copy"><b>Content Studio</b><small>专注内容，而非操作流程</small></div></div><div class="caption">WORKSPACE</div><button class="navitem" data-action="noop">${icon('grid')}<span>工作台</span></button><button class="navitem" data-action="noop">${icon('flame')}<span>热点雷达</span></button><button class="navitem" data-action="noop">${icon('spark')}<span>选题发现</span></button><button class="navitem ${st.view==='editor'?'on':''}" data-view="editor">${icon('file')}<span>作品 / 编辑</span></button><button class="navitem ${st.view==='studio'?'on':''}" data-view="studio">${icon('image')}<span>视觉工作台</span></button><button class="navitem" data-action="noop">${icon('send')}<span>发布中心</span></button><button class="navitem" data-action="noop">${icon('calendar')}<span>内容日历</span></button><button class="navitem" data-action="noop">${icon('layers')}<span>素材库</span></button><div class="sidebottom"><b>当前作品</b><span>桌面 AI Agent 的真正价值，可能不在“替你点鼠标”</span><span style="margin-top:11px;color:#adbdfc">配图规划 3 处 · ${slots.filter(x=>x.adopted).length} 张已采用</span></div></aside>`}
function topbar(){return `<div class="top"><div class="trail"><span>Content Studio</span><span>›</span><strong>${st.view==='editor'?'作品 / 写作':'作品 / 视觉工作台'}</strong></div><div class="topact"><span class="sample">交互原型 · 示例图片</span><button class="btn mobileKeep" data-modal="preview">${icon('eye')} 文章预览</button></div></div>`}
function jobline(){return `<section class="jobline"><div class="jobtitle"><small>作品 / 草稿中 · 最近更新 今天 14:32</small><b>桌面 AI Agent 的真正价值，可能不在“替你点鼠标”</b></div><div class="jobactions"><span class="subtle">● 已保存 · 原型模拟</span><button class="btn" data-view="editor">${icon('edit')} 正文编辑</button><button class="btn ${st.view==='studio'?'primary':''}" data-view="studio">${icon('image')} 视觉工作台</button></div></section>`}
function steps(){return `<div class="steps">${['研究','大纲','写作','审稿','配图','发布'].map((n,i)=>`<div class="step ${i<4?'done':i===4?'now':''}"><i>${i<4?'✓':i+1}</i>${n}</div>${i<5?'<span class="stepsep">›</span>':''}`).join('')}</div>`}
function inlinefigure(slot){if(slot.adopted){return `<button class="inline-slot" data-slot="${slot.id}" data-view="studio"><div class="mini-art">${art(slot.versions[slot.chosen]||0)}</div><div class="text-side"><strong>${slot.title} · 已采用</strong><small>${slot.anchor}<br/>调整、替换或查看版本</small><em>查看图片 →</em></div></button>`;}return `<button class="inline-slot ${slot.status==='planned'?'unused':''}" data-slot="${slot.id}" data-view="studio"><div class="mini-art">${slot.status==='planned'?'<div class="mini-placeholder">＋</div>':art(slot.versions[slot.chosen])}</div><div class="text-side"><strong>${slot.title} · ${slot.status==='planned'?'待生成':'待审阅'}</strong><small>${slot.purpose}</small><em>${slot.status==='planned'?'开始配图':'选择这张图'} →</em></div></button>`}
function doc(){return `<article class="whitepaper" id="article"><div class="paperbar"><span>MASTER DRAFT · 文字已通过初审</span><span>v3 · ${slots.filter(x=>x.adopted).length} 张图片已插入</span></div><h1>桌面 AI Agent 的真正价值，可能不在“替你点鼠标”</h1><p>桌面 AI Agent 似乎离我们越来越近。它可以理解自然语言、调用工具，甚至直接操作桌面应用。但一个令人惊艳的演示，并不自动意味着它适合日常工作。</p><p>这篇文章想讨论的是：<b>当我们真正把 AI 交给工作流程时，应该用什么标准判断它是否可靠？</b></p>${inlinefigure(slots[0])}<h2>01 · 为什么「完成任务」不等于「可靠可用」</h2><p>一段顺利的操作视频，可以证明某项能力在某些条件下能够实现；但真实场景还需要处理权限、错误恢复、上下文缺失和不可预测的页面变化。</p><p class="highlight-quote">待核实：不同类型桌面 Agent 在真实任务中的成功率与失败恢复方式。</p>${inlinefigure(slots[1])}<h2>02 · 用户真正需要的是可控性</h2><p>当助手能够执行越来越多动作，用户需要的不只是“聪明”，还包括了解它为什么这样做、失败后如何恢复，以及哪些关键操作必须由自己确认。</p><h2>03 · 把 Agent 当作可靠的协作者</h2><p>下一步，我们需要结合真实产品和可重复的测试场景，给出更具体的判断，而不是用一次成功的演示替代长期质量。</p>${inlinefigure(slots[2])}<h2>结论与建议</h2><p>真正值得交付的自动化，不是能替你点多少次按钮，而是能否让结果始终可解释、可核查、可恢复。</p></article>`}
function outline(){return `<aside class="outline"><div class="outtitle">文章结构</div><button class="item active">文章开头</button><button class="item">01 · 完成任务</button><button class="item">02 · 可控性</button><button class="item">03 · 可靠协作</button><button class="item">结论与建议</button><div class="outlinegroup"><div class="outtitle">配图定位</div>${slots.map(x=>`<button class="item" data-slot="${x.id}" data-view="studio">${x.title}<small>${x.adopted?'已插入':x.status==='planned'?'待生成':'待审阅'}</small></button>`).join('')}</div><div class="outlinegroup"><div class="outtitle">参考资料</div><p>关联 3 条线索，其中 2 项仍需来源核实。图片不用于证明未经验证的事实。</p></div></aside>`}
function panelPlan(){let filtered=slots.filter(x=>st.mode==='cover'?x.role==='cover':st.mode==='selection'?x.id==='workflow':true);return `<div class="panel tint"><div class="pill blue">STEP 01 · 推荐方案</div><h3 style="margin-top:11px">先确认配图位置，再生成图片</h3><p>系统从正文识别需要解释的段落，建议 ${filtered.length} 处配图。不会覆盖文章，也不会为了凑图增加装饰图片。</p><div class="data-list">${filtered.map(x=>`<div class="data-row"><label><input type="checkbox" data-toggle-slot="${x.id}" ${x.selected?'checked':''}/><span><strong>${x.title}</strong><br/><span class="subtle">${x.anchor}</span></span></label><span class="pill ${x.status==='planned'?'warn':'good'}">${x.adopted?'已插入':x.status==='planned'?'待生成':'有候选'}</span></div>`).join('')}</div><div class="notice">风格建议：克制科技 · 深蓝和暖白 · 几何编辑插画。涉及文字或数字的流程图使用矢量排版，而不是让模型生成汉字。</div></div><div class="panel"><div class="label">统一视觉风格</div><div class="seg">${[['editorial','克制科技'],['warm','杂志叙事'],['nature','自然编辑']].map(([k,t])=>`<button class="${st.style===k?'active':''}" data-style="${k}">${t}</button>`).join('')}</div><p style="margin-bottom:6px">默认沿用作品的系列风格。修改仅影响尚未采用的新图片。</p><div class="data-row" style="margin-top:12px"><span class="subtle">本次预计 ${filtered.filter(x=>x.selected&&!x.adopted).length} 张 · 示意费用 US$0.36</span><button class="textlink" data-action="advanced">高级设置 ${st.advanced?'⌃':'⌄'}</button></div>${st.advanced?`<div style="margin-top:10px"><label class="label">图片模型（可选）</label><select class="select"><option>自动选择可用模型</option><option>OpenAI GPT Image</option><option>Google Gemini / Nano Banana</option><option>Qwen Image</option></select><p>费用和模型名称仅为界面示意，未连接真实服务。生成前展示实际配置。</p></div>`:''}<button class="btn primary" style="width:100%;margin-top:14px" data-action="generate">${icon('spark')} 生成选中的图片</button></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h3>逐张审阅</h3><button class="textlink" data-view="studio">打开完整工作台 →</button></div>${filtered.map(x=>`<div class="cardrow"><div class="thumb">${x.versions.length?art(x.versions[x.chosen]):'<div class="mini-placeholder">+</div>'}</div><div class="desc"><strong>${x.title}</strong><small>${x.adopted?'已采用 · 正文可见':x.versions.length?'有候选，待采用':'还没有生成'}</small></div><button data-slot="${x.id}" data-view="studio">${x.versions.length?'选图':'规划'}</button></div>`).join('')}</div>`}
function inspector(){return `<aside class="inspector"><div class="ins-head"><div class="magic">✧</div><div><b>AI 配图助手</b><small>先规划，再生成，逐张审阅</small></div></div><div class="seg">${[['cover','只做封面'],['full','完整配图'],['selection','指定段落']].map(([k,t])=>`<button class="${st.mode===k?'active':''}" data-mode="${k}">${t}</button>`).join('')}</div>${panelPlan()}<div class="notice orange">所有图片均为原型内置示意素材。点击「生成」不会请求模型、扣费或修改真实文章。</div></aside>`}

function statusText(x){return x.adopted?'已采用':x.status==='planned'?'待生成':'待审阅'}
function shootlist(){return `<aside class="shotlist"><div style="display:flex;justify-content:space-between;align-items:center"><h3>配图清单</h3><span class="pill blue">${slots.length} 处</span></div><p class="subtle">生成失败不会影响其他图片，可随时返回正文继续写作。</p><div class="shotitems">${slots.map(x=>`<button class="shotitem ${st.slot===x.id?'selected':''}" data-slot="${x.id}"><div class="shot-thumb">${x.versions.length?art(x.versions[x.chosen]):'<div class="mini-placeholder">+</div>'}</div><div style="min-width:0"><b>${x.title}</b><small>${x.anchor}</small><span class="pill ${x.adopted?'good':x.status==='planned'?'warn':'blue'}">${statusText(x)}</span></div></button>`).join('')}</div><div class="notice" style="margin-top:20px">${icon('check',13)} 文章正文和生成历史独立保存。重做一张图不会重做整篇文章。</div></aside>`}
function centerStudio(){const x=S(),v=x.versions[x.chosen]??0;return `<section class="studiomain"><div class="showcase"><div class="showcasebar"><div><div class="microcap">SELECTED ARTWORK</div><h2 style="margin-top:6px">${x.title} <span class="pill ${x.adopted?'good':x.status==='planned'?'warn':'blue'}">${statusText(x)}</span></h2></div><span class="subtle">${x.size} · 原型图</span></div><div class="bigart">${x.versions.length?art(v):'<div class="emptyart"><div><b>这一处还没有图片</b><p>生成前请先确认构图与内容用途</p></div></div>'}</div><div class="art-tools"><div class="chipstrip"><button class="btn tiny" data-action="compare" ${x.versions.length<2?'disabled':''}>${icon('compare')} 对比版本</button><button class="btn tiny" data-modal="preview">${icon('eye')} 正文预览</button><button class="btn tiny" data-action="download">${icon('download')} 下载示意图</button></div><button class="btn primary" data-action="adopt" ${x.versions.length===0?'disabled':''}>${icon('check')} ${x.adopted?'替换为当前版本':'采用这张图'}</button></div></div><div class="surface" style="margin-top:17px"><div class="showcasebar"><div><h2>候选版本</h2><p class="subtle" style="margin:5px 0 0">选择版本不会自动改变文章；点击「采用」才写入。</p></div><button class="btn tiny" data-action="variation">${icon('refresh')} ${x.versions.length?'再生成一版':'生成第一版'}</button></div><div class="variantgrid">${x.versions.map((n,i)=>`<button class="variant ${i===x.chosen?'selected':''}" data-variant="${i}"><div class="art">${art(n)}</div>${i===x.chosen?'<span class="tick">✓</span>':''}<b>方案 ${i+1}${i===x.chosen?' · 当前预览':''}</b><small>${i===0?'初始方案':'迭代版本'} · 保留历史</small></button>`).join('')}${x.versions.length===0?'<div class="notice">暂无候选图，可在右侧点击生成。</div>':''}</div></div><div class="notice orange" style="margin-top:17px">生成结果需检查是否与文章相符、是否产生虚构的 UI 截图、文字是否可读、平台裁切是否正确。图片本身不是事实证据。</div></section>`}
function studioRight(){let x=S();return `<aside class="studioins"><div class="sidegroup"><h3>这张图片要表达什么</h3><div class="notice">${x.why}</div><p class="rightstat" style="margin-top:12px">对应位置：${x.anchor}<br/>图片比例：${x.size}</p><div class="data-row" style="margin-top:12px"><span class="subtle">方案源于正文 v3</span><button class="textlink" data-view="editor" data-mobile="article">返回正文定位 →</button></div></div><div class="sidegroup"><h3>视觉方向</h3><div class="stylechips">${[['editorial','克制科技',['#303f70','#9baee0','#f1f3fb']],['warm','杂志叙事',['#ede6dd','#ccac8f','#3b555c']],['nature','自然编辑',['#244e42','#8aab98','#f0e8d7']]].map(([id,name,c])=>`<button class="stylebtn ${st.style===id?'chosen':''}" data-style="${id}"><div class="swatch">${c.map(col=>`<i style="background:${col}"></i>`).join('')}</div><b>${name}</b></button>`).join('')}</div><p class="rightstat">整篇文章默认锁定配色和版式性格。修改风格只影响后续新图。</p></div><div class="sidegroup"><h3>直接用自然语言修改</h3><textarea class="textarea" id="editPrompt" aria-label="图片修改指令" placeholder="例如：弱化背景几何，让视觉重点落在三段流程…">${escapeHTML(st.quote)}</textarea><div class="chipstrip" style="margin:9px 0 12px"><button class="btn tiny" data-quick="去掉图中所有文字">去除文字</button><button class="btn tiny" data-quick="保持主体，把背景改为暖白色">换成暖白</button><button class="btn tiny" data-quick="保持主体，重新适配公众号 2.35:1 裁切">适配封面</button></div><button class="btn primary" style="width:100%" data-action="edit-image">${icon('spark')} ${x.versions.length?'基于当前图生成修改版':'生成本段图片'}</button><p class="rightstat" style="margin-top:9px">每次生成都是新版本；不会覆盖原图和文章已采用的版本。</p></div><div class="sidegroup"><h3>专业编辑工具</h3><div class="ins-actions"><button class="btn tiny" data-action="crop">${icon('crop')} 调整裁切</button><button class="btn tiny" data-action="variation">${icon('refresh')} 生成相似图</button><button class="btn tiny" data-action="refimage">${icon('image')} 添加参考图</button></div><details class="details"><summary>模型与成本 · 高级设置</summary><label class="label">图片供应商</label><select class="select"><option>自动选择（推荐）</option><option>OpenAI Image</option><option>Gemini Image</option><option>Qwen Image</option></select><p class="rightstat">执行前显示预计用量、图片数量与失败重试上限；不隐藏实际调用。</p></details></div><div class="sidegroup"><h3>图像说明与可访问性</h3><label class="label">图片描述（Alt Text）</label><textarea class="textarea" id="altText" style="min-height:65px">${escapeHTML(x.alt)}</textarea><button class="btn tiny" style="margin-top:8px" data-action="save-alt">保存描述</button></div></aside>`}
function studio(){return `${jobline()}<section class="studiohead"><div><div class="microcap">VISUAL STUDIO · CREATOR V2.3</div><h1>让每一张图片都有它的位置</h1><p>左侧选段落，中间选图与对比，右侧自然语言调整。采用后直接回到文章。</p></div><div class="jobactions"><button class="btn" data-view="editor">${icon('back')} 返回文章</button><button class="btn primary" data-modal="preview">${icon('eye')} 查看最终效果</button></div></section><div class="studio-layout maininner">${shootlist()}${centerStudio()}${studioRight()}</div>`}
function modal(){if(!st.modal)return '';const x=S();if(st.modal==='compare'){let a=x.versions[x.chosen]??0;let b=x.versions[st.compareSelect]??a;return `<div class="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="对比图片版本" ><div class="modalheader"><h2>图片版本对比 · ${x.title}</h2><button class="btn tiny" data-action="close-modal">${icon('close')}</button></div><div class="modalbody"><p class="muted">左侧是当前预览，右侧是另一个可选版本。切换右侧版本不会影响当前稿件。</p><div class="comparegrid"><div><b>当前选择 · 方案 ${x.chosen+1}</b>${svgbox(a)}</div><div><b>对比版本 · 方案 ${st.compareSelect+1}</b>${svgbox(b)}<select class="select" style="margin-top:11px" id="compareOther">${x.versions.map((n,i)=>`<option value="${i}" ${i===st.compareSelect?'selected':''}>方案 ${i+1}</option>`).join('')}</select></div></div></div><div class="modalfoot"><button class="btn" data-action="close-modal">关闭</button><button class="btn primary" data-action="use-compared">使用右侧版本预览</button></div></section></div>`}
if(st.modal==='preview'){return `<div class="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="文章平台预览" ><div class="modalheader"><div><h2>文章实际阅读预览</h2><p class="subtle" style="margin:5px 0 0">仅显示已采用图片；各平台仍须独立核对裁切</p></div><button class="btn tiny" data-action="close-modal">${icon('close')}</button></div><div class="modalbody" style="background:#fafbfc"><div class="seg" style="max-width:300px;margin:0 auto 15px"><button class="${st.previewPlatform==='wechat'?'active':''}" data-preview="wechat">公众号</button><button class="${st.previewPlatform==='zhihu'?'active':''}" data-preview="zhihu">知乎</button></div><div class="phonepreview"><div class="subtle">${st.previewPlatform==='wechat'?'微信公众号 · 图文预览':'知乎 · 文章预览'}</div><h2>桌面 AI Agent 的真正价值，可能不在“替你点鼠标”</h2><p>一段令人惊艳的操作演示，并不意味着它能够稳定完成真实工作。可靠性还包括执行证据、失败恢复和必要的人工确认。</p>${slots[0].adopted?`${svgbox(slots[0].versions[slots[0].chosen])}<div class="previewcap">${slots[0].alt}</div>`:''}<h3>01 · 为什么演示不等于可靠可用</h3><p>真正的使用环境里，需要清楚看到任务状态、执行边界以及可以恢复的工作结果。</p>${slots[1].adopted?`${svgbox(slots[1].versions[slots[1].chosen])}<div class="previewcap">${slots[1].alt}</div>`:''}<h3>02 · 协作的关键是可控性</h3><p>什么时候让 Agent 自动完成，什么时候留给用户做决定，才是我们更需要关注的问题。</p>${slots[2].adopted?`${svgbox(slots[2].versions[slots[2].chosen])}<div class="previewcap">${slots[2].alt}</div>`:''}</div></div><div class="modalfoot"><span class="subtle" style="margin-right:auto;align-self:center">已采用 ${slots.filter(x=>x.adopted).length} / 3 张</span><button class="btn primary" data-action="close-modal">继续配图</button></div></section></div>`}
if(st.modal==='confirm'){const count=slots.filter(x=>x.selected&&!x.adopted&&(x.status==='planned'||x.status==='candidate')).length;return `<div class="backdrop"><section class="modal slim" role="dialog" aria-modal="true" aria-label="确认图片生成" ><div class="modalheader"><h2>确认本次生成范围</h2><button class="btn tiny" data-action="close-modal">${icon('close')}</button></div><div class="modalbody"><p style="line-height:1.8">将为 <b>${count}</b> 个配图位置生成新的候选图。之前采用的图片不会被修改。</p><div class="notice">本次属于原型演示，不调用任何模型也不产生费用。真实产品将在此显示供应商、准确数量、估算费用与授权范围。</div><div class="data-list">${slots.filter(x=>x.selected&&!x.adopted&&(x.status==='planned'||x.status==='candidate')).map(x=>`<div class="data-row"><strong>${x.title}</strong><span class="subtle">${x.size}</span></div>`).join('')}</div></div><div class="modalfoot"><button class="btn" data-action="close-modal">返回调整</button><button class="btn primary" data-action="run-generate">确认生成示意图</button></div></section></div>`}
return `<div class="backdrop"><section class="modal slim" role="dialog" aria-modal="true" ><div class="modalheader"><h2>专业编辑（交互示意）</h2><button class="btn tiny" data-action="close-modal">${icon('close')}</button></div><div class="modalbody"><p>正式版会在这里提供非破坏性的 ${st.modal==='crop'?'裁切框与比例调节':st.modal==='refimage'?'参考图上传、授权范围和权重设置':'操作'}，保持原始素材和已采用图片不变。</p></div><div class="modalfoot"><button class="btn primary" data-action="close-modal">完成</button></div></section></div>`}
function bottom(){return `<nav class="mobilebottom" aria-label="移动端视觉工作流"><button class="${st.view==='editor'&&st.mobileTab==='article'?'active':''}" data-view="editor" data-mobile="article">${icon('file')}正文</button><button class="${st.view==='editor'&&st.mobileTab==='assistant'?'active':''}" data-view="editor" data-mobile="assistant">${icon('spark')}配图规划</button><button class="${st.view==='studio'?'active':''}" data-view="studio">${icon('image')}选图编辑</button><button data-modal="preview">${icon('eye')}预览</button></nav>`}
function render(){document.getElementById('app').innerHTML=`<div class="layout">${nav()}<div class="shell">${topbar()}${st.view==='editor'?editor():studio()}</div></div>${bottom()}${modal()}<div class="floater hidden" aria-live="polite"></div>`}
function setView(v){st.view=v;if(v==='editor'&&window.innerWidth<760)st.mobileTab=st.mobileTab==='assistant'?'assistant':'article';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{if(e.target.classList?.contains('backdrop')){st.modal='';render();return}const el=e.target.closest('[data-view],[data-mode],[data-mobile],[data-slot],[data-style],[data-action],[data-modal],[data-preview],[data-variant],[data-quick]');if(!el)return;const d=el.dataset;if(d.slot){st.slot=d.slot;if(!d.view){render();return}}if(d.mobile){st.mobileTab=d.mobile;if(!d.view){render();return}}if(d.view){setView(d.view);return}if(d.mode){st.mode=d.mode;render();return}if(d.style){st.style=d.style;render();return}if(d.modal){st.modal=d.modal;render();return}if(d.preview){st.previewPlatform=d.preview;render();return}if(d.variant!==undefined){S().chosen=Number(d.variant);render();return}if(d.quick){const t=document.getElementById('editPrompt');if(t)t.value=d.quick;return}const a=d.action;if(!a)return;if(a==='close-modal'){st.modal='';render();return}if(a==='advanced'){st.advanced=!st.advanced;render();return}if(a==='channel'){toast('请在正式平台稿中确认样式与图片位置。这里展示统一主稿。');return}if(a==='noop'){toast('此轮专注配图工作流，其余页面沿用 Creator V2.2。');return}if(a==='generate'){if(!slots.some(x=>x.selected&&!x.adopted&&(x.status==='planned'||x.status==='candidate')))return toast('当前选择均已采用，可在视觉工作台生成新版本');st.modal='confirm';render();return}if(a==='run-generate'){for(const x of slots){if(x.selected&&!x.adopted){if(x.versions.length===0)x.versions=[6,7];else x.versions.push(x.role==='cover'?st.style==='warm'?1:st.style==='nature'?2:5:6);x.status='candidate';x.chosen=x.versions.length-1}}st.modal='';st.slot='trust';setView('studio');toast('已生成演示候选图。逐张选择并采用后才会插入正文。');return}if(a==='adopt'){const x=S();if(!x.versions.length)return toast('当前没有图片可以采用');x.adopted=true;render();toast(`「${x.title}」已采用为当前版本；其他位置不受影响。`);return}if(a==='variation'){let x=S();x.versions.push(x.role==='cover'?[0,1,2,5][x.versions.length%4]:x.id==='workflow'?4:7);x.chosen=x.versions.length-1;x.status='candidate';render();toast('新增一个示意候选版本。旧图及已采用版本均保留。');return}if(a==='edit-image'){const val=document.getElementById('editPrompt')?.value.trim();if(!val)return toast('先说明你希望修改的内容');const x=S();x.versions.push(x.role==='cover'?st.style==='warm'?1:st.style==='nature'?2:5:x.id==='workflow'?4:7);x.chosen=x.versions.length-1;x.status='candidate';st.quote=val;render();toast('修改版已加入候选。需要点击「采用这张图」才会写入正文。');return}if(a==='compare'){st.compareSelect=(S().chosen+1)%Math.max(1,S().versions.length);st.modal='compare';render();return}if(a==='use-compared'){S().chosen=st.compareSelect;st.modal='';render();toast('已切换预览候选。还需点击「采用」才会影响文章。');return}if(a==='save-alt'){S().alt=document.getElementById('altText')?.value.trim()||S().alt;toast('图片描述已保存到原型状态');return}if(a==='download'){toast('原型图片是内嵌 SVG 示意图；正式版本提供原图、平台图和元数据下载。');return}if(a==='crop'||a==='refimage'){st.modal=a;render();return}});
document.addEventListener('change',e=>{if(e.target.dataset.toggleSlot){const x=slots.find(s=>s.id===e.target.dataset.toggleSlot);if(x)x.selected=e.target.checked}if(e.target.id==='compareOther'){st.compareSelect=Number(e.target.value);render()}});
render();
</script></body></html>
